name: release

# Manual only — a release is a deliberate act, not a side effect of a push.
# The "Require main" step below is the actual guard; `just bump` performs no
# git-state check of its own, so nothing else in this workflow prevents it
# from running against whatever is checked out.
on:
  workflow_dispatch:
    inputs:
      level:
        description: "major | minor | patch | premajor | preminor | prepatch | prerelease | X.Y.Z"
        required: true
        default: patch
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::release must run against main (got ${{ github.ref }})"
          exit 1

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      # Same rationale as pr-verify.yml: `ivm-node` / `ivm-pnpm` are
      # asdf plugin names that only resolve on Inditex-provisioned machines.
      - name: Read toolchain versions
        id: toolchain
        run: |
          {
            echo "node=$(awk '/^ivm-node /{print $2}' code/.tool-versions)"
            echo "pnpm=$(awk '/^ivm-pnpm /{print $2}' code/.tool-versions)"
          } >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ steps.toolchain.outputs.pnpm }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.toolchain.outputs.node }}
          cache: pnpm
          cache-dependency-path: code/pnpm-lock.yaml

      - name: Setup just
        uses: extractions/setup-just@v2

      # code/.npmrc pins the default registry to npmjs. The IOP Design System
      # is not installed in this workspace — see code/tools/ids/README.md —
      # so this needs no credential and never contacts Artifactory.
      - name: Install dependencies
        working-directory: code
        run: pnpm install --frozen-lockfile

      - name: Verify before releasing
        working-directory: code
        run: |
          pnpm lint
          pnpm typecheck
          pnpm format:check

      - name: Bump version
        id: bump
        run: |
          just bump ${{ inputs.level }}
          version=$(node -p "require('./code/package.json').version")
          echo "version=${version}" >> "$GITHUB_OUTPUT"

          # A prerelease identifier (1.2.3-rc.0) marks this a GitHub prerelease.
          # `just bump prerelease` and an explicit `X.Y.Z-...` both produce one;
          # this reads the result rather than re-deriving it from the input, so
          # it stays correct regardless of which path produced the version.
          if [[ "$version" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        working-directory: code
        run: pnpm build

      - name: Locate ui-bundle artifact
        id: artifact
        run: |
          version='${{ steps.bump.outputs.version }}'
          path="code/packages/ui-bundle/build/ui-bundle-${version}.zip"
          if [ ! -f "$path" ]; then
            echo "::error::expected build artifact not found: $path"
            exit 1
          fi
          echo "path=${path}" >> "$GITHUB_OUTPUT"

      - name: Commit and tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version='${{ steps.bump.outputs.version }}'
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add code/package.json code/packages/*/package.json
          git commit -m "chore: release v${version}"
          git tag "v${version}"
          # actions/checkout leaves HEAD detached, not on a local branch named
          # `main` — `git push origin main` would fail with "src refspec main
          # does not match any". HEAD:main is correct whether HEAD happens to
          # be attached or detached.
          git push origin HEAD:main
          git push origin "v${version}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version='${{ steps.bump.outputs.version }}'
          prerelease_flag=""
          if [ '${{ steps.bump.outputs.prerelease }}' = 'true' ]; then
            prerelease_flag="--prerelease"
          fi
          gh release create "v${version}" \
            --title "v${version}" \
            --generate-notes \
            $prerelease_flag \
            '${{ steps.artifact.outputs.path }}'

  # Off by default. `pdocs-ui-bundle` (and any future package) is `private`
  # today, and publishing is not settled internally yet — see the pdocs design
  # conversation this workflow came out of. Flip `vars.NPM_PUBLISH_ENABLED` to
  # `true` once that is resolved; nothing else here needs to change.
  #
  # Trusted publishing (OIDC + provenance, no long-lived npm token) needs
  # npm >= 11.5.1 and the package's registry settings configured for it on
  # npmjs.com first. The first publish of a new package cannot use OIDC — the
  # package must already exist for npm to know which OIDC identity to trust —
  # so this keeps NPM_TOKEN as a fallback for that one case, same shape as
  # https://github.com/InditexTech/weavejs's
  # code-npm_node-publish-release-and-snapshot.yml.
  publish-npm:
    name: Publish npm packages
    needs: release
    if: vars.NPM_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-24.04
    permissions:
      # Job-level `permissions:` replaces the workflow-level block rather than
      # adding to it, so contents: read has to be restated here — this repo is
      # currently private, and checkout needs it to fetch anything.
      contents: read
      id-token: write
    steps:
      - name: Checkout released tag
        uses: actions/checkout@v4
        with:
          ref: v${{ needs.release.outputs.version }}

      - name: Read toolchain versions
        id: toolchain
        run: |
          {
            echo "node=$(awk '/^ivm-node /{print $2}' code/.tool-versions)"
            echo "pnpm=$(awk '/^ivm-pnpm /{print $2}' code/.tool-versions)"
          } >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ steps.toolchain.outputs.pnpm }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.toolchain.outputs.node }}
          registry-url: https://registry.npmjs.org/
          cache: pnpm
          cache-dependency-path: code/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: code
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: code
        run: pnpm build

      - name: Publish ui-bundle
        working-directory: code/packages/ui-bundle
        env:
          NPM_CONFIG_PROVENANCE: "true"
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # First publish of a package npm has never seen cannot use OIDC —
          # there is no existing package to attach the trust relationship to.
          # `npm publish` with a token succeeds either way; once the package
          # exists on npmjs.com and its trusted-publisher config points at
          # this workflow, drop NODE_AUTH_TOKEN and OIDC takes over on its own.
          npm publish --access public
