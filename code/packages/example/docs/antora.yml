# The component name is the site's first URL segment: pages live at
# /weavejs/<module>/<page>, and this component's ROOT pages — the landing —
# directly at /weavejs/. It has nothing to do with the `docs/` directory this
# file sits in, which Antora never puts in a URL.
name: weavejs
title: Weave.js
version: ~
# The site's landing page (GH-18): `modules/ROOT/pages/index.adoc`, rendered
# through the UI bundle's `home` layout. A ROOT module index is what Antora
# treats as a component's start page by default, but naming it here is what
# stops it fabricating a synthetic component-root "previous" URL for the first
# nav entry — a page that doesn't exist — which broke the pagination footer's
# "previous" link on the very first page of the site.
#
# ROOT is deliberately absent from the `nav` list below: the landing is reached
# from the header's product name and the side menu's brand block, not as a row
# in the navigation tree, and it borrows `main`'s navigation for its own side
# menu (`:page-nav-module:` in that page's own header).
start_page: ROOT:index.adoc
nav:
  - modules/main/nav.adoc
  - modules/sdk/nav.adoc
  - modules/react/nav.adoc
  - modules/store-websockets/nav.adoc
  - modules/store-azure-web-pubsub/nav.adoc
  - modules/store-standalone/nav.adoc
  - modules/types/nav.adoc

# Per-module navigation metadata, read by @inditextech/pdocs-antora-extensions
# (registered under `antora.extensions` in the playbook) and attached to the
# navigation trees Antora builds from the `nav` list above. It is what lets the
# UI show ONE module's navigation at a time with a switcher between them, the
# way Fumadocs did with `"root": true` in each module's own meta.json.
#
# A LIST, not a map keyed by module — deliberately, and it must stay one.
# @antora/content-aggregator runs the whole descriptor through `camelCaseKeys`,
# which recurses into nested objects and rewrites their KEYS. As a map, three of
# the seven modules below would arrive at the extension renamed
# (`store-azure-web-pubsub` as `storeAzureWebPubsub`) and match nothing. Values
# are left alone, so the slug rides as a value instead.
#
# `icon` is `<group>/<name>` from the UI bundle's own vendored sprite
# (packages/ui-bundle/src/img/icons.yml), not a free-form name. The IOP Design
# System is a retail icon set with no developer iconography, so these are the
# nearest honest stand-ins for Fumadocs' Lucide originals rather than matches.
#
# --- generated by code/tools/fumadocs-migrate/build-nav.mjs — do not edit by hand
nav_modules:
  - module: main
    title: Framework
    description: The visual collaborative apps framework
    icon: design/grid-outlined
  - module: sdk
    title: SDK
    description: The visual collaborative tool headless library
    icon: actions/code-block-outlined
  - module: react
    title: React Helper
    description: Set of React components to help you integrate Weave.js
    icon: design/tool-outlined
  - module: store-websockets
    title: Websockets Store
    description: Store implementation using WebSockets as transport
    icon: connectivity/wifi-outlined
  - module: store-azure-web-pubsub
    title: Azure Web Pubsub Store
    description: Store implementation using Azure Web Pubsub as transport
    icon: connectivity/cloud-outlined
  - module: store-standalone
    title: Standalone Store
    description: Store implementation to render a Weave.js canvas in a direct way, just pass a room data.
    icon: others/server-outlined
  - module: types
    title: TypeScript Types
    description: Package that contains the TypeScript types definitions
    icon: business/file-outlined
# --- end generated

# Site footer link groups (ui-bundle GH issue #18), read by
# @inditextech/pdocs-antora-extensions and attached to this component version
# as `footer`. Authored here rather than in the playbook because `site.keys`
# is a flat primitive map and cannot carry a list — see that extension's own
# header for the full reasoning, which is the same one `nav_modules` above
# rests on.
#
# Group 1 fills the footer's links column. Group 2 is used for the modules
# column only when a component has fewer than two switchable modules, which
# this one does not — it is here as documentation of the fallback rather than
# because this site needs it.
#
# `url` is either a page ID — the same string you would write inside
# `xref:...[]`, resolved against this component — or a literal URL. One that
# resolves to no page is dropped with a warning rather than rendered dead.
footer:
  groups:
    - links:
        - text: Home
          url: ROOT:index.adoc
        - text: Repository
          url: https://github.com/InditexTech/weavejs
