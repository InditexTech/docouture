#
# Hand-written fixture standing in for what Antora computes at build time.
# Rewritten to be design-shaped (see .figma design linked from GH issue #1 /
# #8) rather than the inherited antora-ui-default sample: one product, the
# Figma side-menu tree, a "Stable" version tag (green only on `latest`) and a
# repo link.
#
# YAML anchors are load-bearing, not decorative: `nav-explore.hbs` compares
# the current component/version against `site.components[].versions[]` with
# the `eq` helper, which for objects is identity — so "the latest version"
# and "the version this page is on" must be the SAME node for `is-current`
# and `is-latest` to light up. Keep every `is-current` / `is-latest` case
# wired through an anchor, not a value that merely looks equal.
#
# Intentionally thin: `site.keys` (beyond `repoUrl`), `page.attributes` are
# populated per-page by build-preview-pages.js, not here. If you add a
# partial that reads a branch this fixture doesn't cover, extend it — don't
# let the gap surface for the first time in a real build.
#
# `asciidoc.extensions` below IS read directly from here (not synthesised
# per-page) — build-preview-pages.js requires each entry and registers it
# globally against Asciidoctor 4.0's own registry before converting
# preview-src/*.adoc, then copies the resulting extensions list onto every
# version's `asciidoc` — see that file's own header comment.
#
antoraVersion: '1.0.0'
asciidoc:
  extensions:
    # GH-14: `label:red[Text]` / `label:[Text]` (grey default) — an IDS
    # Label inline; `mono:[text]` — plain monospaced text, no code chip.
    # Requires the ui-bundle devDependency (package.json) so plain
    # `require()` (not Antora's user-require-helper, unused here)
    # resolves it.
    - '@inditextech/pdocs-asciidoc-extensions'
site:
  url: http://localhost:5252
  title: Atd Docs
  # The site's start page: home.adoc, the `home` layout's fixture (GH-18).
  # Distinct from the component landing below on purpose — the header
  # toolbar's product name and the side menu's brand block both point here,
  # not at the current component, and only a fixture where the two differ can
  # show that.
  homeUrl: /home.html
  keys:
    # The landing's decorative background (GH-18, head-styles.hbs → home.css).
    # The design's own artwork, exported from Figma node 2696:54670;
    # copyPreviewAssets ships preview-src/*.jpg verbatim. Absent, the landing
    # renders on a plain surface, which is also worth previewing — comment
    # this out to see it.
    homeBackground: /home-background.jpg
    repoUrl: https://github.com/InditexTech/atd-docs
    # Page footer "how to contribute" button (GH-16): a playbook-level key,
    # same convention as repoUrl above and productLogo below — absent, the
    # button doesn't render (see footer-content.hbs).
    contributeUrl: https://github.com/InditexTech/atd-docs/blob/main/CONTRIBUTING.md
    # Side-menu brand symbol (GH-8): a plain placeholder mark, not a design
    # asset — nav-brand.hbs renders the product name alone when this key is
    # absent, so both paths are worth previewing; this fixture exercises the
    # "logo present" one. copyPreviewAssets ships preview-src/*.svg verbatim.
    productLogo: /product-logo.svg
    # Dark counterpart (GH-9 follow-up): product-logo.svg is a plain black
    # stroke, invisible against a dark side menu with nothing here to swap
    # to — see nav-brand.hbs's own comment for why `currentColor` doesn't
    # save an externally-referenced <img>. This fixture exercises the "both
    # configured" path; a real site missing this key still gets the light
    # mark unconditionally rather than losing it in dark mode.
    productLogoDark: /product-logo-dark.svg
  components:
    - &component
      name: atd
      title: &component_title ATD
      url: &component_url /landing.html
      versions:
        - &latest_version
          title: *component_title
          url: *component_url
          version: stable
          displayVersion: Stable
          latest: true
          # Site footer link groups (GH-18): not Antora's either —
          # @inditextech/pdocs-antora-extensions reads them from the component
          # descriptor's own `footer` key and attaches them here, with every
          # `url` already resolved. The first group is the footer's links
          # column; the second is only reached on a site with fewer than two
          # navigable modules, which this fixture is not — see site-footer.hbs.
          # It is here so the fallback is at least visible in the model.
          footer:
            groups:
              - links:
                  - text: Home
                    url: /home.html
                  - text: Repository
                    url: https://github.com/InditexTech/atd-docs
              - links:
                  - text: Content test page
                    url: /content.html
        - url: '#'
          version: '2024.1'
          displayVersion: '2024.1'
      latestVersion: *latest_version
    - name: platform
      title: Platform
      url: '#'
      versions:
        - &platform_version
          url: '#'
          version: '3.4'
          displayVersion: '3.4'
      latestVersion: *platform_version
page:
  url: *component_url
  home: true
  title: Hardware and Software Requirements
  component: *component
  componentVersion: *latest_version
  version: stable
  displayVersion: Stable
  module: ROOT
  relativeSrcPath: index.adoc
  editUrl: https://github.com/InditexTech/atd-docs/edit/main/docs/modules/ROOT/pages/index.adoc
  origin:
    private: false
    # Antora derives this per-component from the content source's git remote;
    # header-toolbar's repo link falls back to it when site.keys.repoUrl (set
    # above) is absent. Kept here so the fallback branch is exercised too.
    webUrl: https://github.com/InditexTech/atd-docs
  previous:
    content: Getting started
    url: '#'
    urlType: internal
  next:
    content: Features
    url: '#'
    urlType: internal
  breadcrumbs:
    - content: Overview
      url: '#'
      urlType: fragment
    - content: Hardware and Software Requirements
      url: *component_url
      urlType: internal
  versions:
    - version: stable
      displayVersion: Stable
      latest: true
      url: '#'
    - version: '2024.1'
      displayVersion: '2024.1'
      url: '#'
    - version: '2023.2'
      displayVersion: '2023.2'
      missing: true
      url: '#'
  # Mirrors the Figma side menu (see GH issue #8): top-level entries, one of
  # which ("Features") has its own nested branch — both a `url` and `items`,
  # so it renders expandable with a chevron, like any real page with
  # sub-pages in its own nav.adoc — plus one entry two levels deep ("Virtual
  # Threads" also has its own subpage) so nav-tree recursion, `--tree--
  # level-N` indentation and the expand/collapse toggle all get exercised
  # without the fixture needing a rewrite on every design tweak.
  #
  # An earlier version of this fixture put these under a separate, url-less
  # "Components" wrapper node (Antora's model does allow one, and nav-tree.hbs
  # still renders it correctly — no row, just its children) rather than
  # under Features directly. Visually that looked identical modulo one
  # thing: no chevron on Features, because structurally the sub-items
  # weren't Features' own. That's backwards from what any real "Features"
  # page with sub-pages would produce, so it's fixed here instead of left
  # for the sake of covering the wrapper case.
  navigation:
    # `module`, `title`, `description`, `icon` and `startUrl` are not Antora's:
    # @inditextech/pdocs-antora-extensions stamps them onto each root menu from
    # the component descriptor's own `nav_modules` key. Two modules here, not
    # one, so the preview actually renders nav-switcher.hbs — nav-menu.hbs
    # shows only the tree whose `module` matches `page.module` above, and the
    # second exists purely to give the switcher something to switch to. A
    # single-module fixture would leave both code paths uncovered.
    - root: true
      module: ROOT
      title: Platform
      description: The platform documentation
      icon: design/grid-outlined
      startUrl: *component_url
      items:
        # A `content` with neither `url` nor `items` is a section label — the
        # shape Fumadocs' `"---Label---"` separators converted to. Two of them,
        # so the preview shows both the first-child case (no space above it)
        # and a mid-list one (which gets --side-menu-label-gap).
        - content: Overview
        - content: Introduction
          url: *component_url
          urlType: internal
        - content: Getting started
          url: '#getting-started'
          urlType: fragment
        - content: Features
          url: '#features'
          urlType: fragment
          items:
            - content: Architecture overview
              url: '#architecture-overview'
              urlType: fragment
            - content: Supported artifacts
              url: '#supported-artifacts'
              urlType: fragment
            - content: Teams
              url: '#teams'
              urlType: fragment
            - content: Virtual Threads
              url: '#virtual-threads'
              urlType: fragment
              items:
                - content: Subpage
                  url: '#virtual-threads-subpage'
                  urlType: fragment
            - content: Resilience
              url: '#resilience'
              urlType: fragment
            - content: Administration
              url: '#administration'
              urlType: fragment
            - content: Tasks and notifications
              url: '#tasks-and-notifications'
              urlType: fragment
        - content: Administration
        - content: Roles and Permissions
          url: '#roles-and-permissions'
          urlType: fragment
        - content: Templates
          url: '#templates'
          urlType: fragment
        - content: Integrations
          url: '#integrations'
          urlType: fragment
        - content: Additional Information
          url: '#additional-information'
          urlType: fragment
    - root: true
      module: sdk
      title: SDK
      description: The headless client library
      icon: actions/code-block-outlined
      startUrl: *component_url
      items:
        - content: Introduction
          module: sdk
        - content: Overview
          url: '#'
          urlType: internal
          module: sdk

#
# GH-103 — three entries, one per version-relationship page-versions.hbs
# actually distinguishes on the dropdown's current row (Latest / older
# Stable / Prerelease — not the read-only single-version badge branch,
# which needs no dropdown content to vary and is reviewable off any one of
# these by just deleting all but its own `versions` entry in devtools),
# each a real, separate preview page (page-versions-*.adoc,
# `:page-version-scenario: <key>`) rather than several fake copies of the
# partial glued into one page: `@root.page.version` — what `{{#each page.
# versions}}{{#if (eq ./version @root.page.version)}}` in page-versions.hbs
# actually compares against, to find the current row — is Handlebars' true
# render root and does not change inside `{{#with}}` or a partial call, so
# overriding `page` locally to show several variants side by side on one
# page cannot make `is-current` light up correctly for more than the
# first. A separate page per scenario, run through the real `default`
# layout exactly like a real Antora page, doesn't have that problem and
# additionally makes every other page-chrome concern (breakpoint, dark
# mode, side-menu drawer position) reviewable per scenario instead of only
# in a static mockup.
#
# build-preview-pages.js reads `page-version-scenario` off each .adoc file
# and, when it names a key here, shallow-merges that key's fields onto the
# page's own `page.*` — everything else (navigation, breadcrumbs, component)
# stays whatever the base fixture above already set.
#
pageVersionsScenarios:
  # Multi-version, current release is Stable AND Antora's `latest` — the
  # dropdown's current row gets the green "Latest" pill (Figma
  # 5SAtxqb5sdtIqDQzz70yts#2610-32852); the toggle/badge are
  # `--stable`-green throughout. Ten rows, one of them a long, real-looking
  # version string — enough to exercise the menu's own max-height scroll
  # (GH-103) and confirm long labels don't wrap.
  stable-latest:
    componentVersion:
      displayVersion: v2.4.0
      prerelease: false
      latest: true
    version: v2.4.0
    displayVersion: v2.4.0
    versions:
      - version: v2.4.0
        displayVersion: v2.4.0
        latest: true
        url: '#'
      - version: v2.3.1
        displayVersion: v2.3.1
        url: '#'
      - version: v2.3.0
        displayVersion: v2.3.0-rc.1+build.20240315
        url: '#'
      - version: v2.2.2
        displayVersion: v2.2.2
        url: '#'
      - version: v2.2.1
        displayVersion: v2.2.1
        url: '#'
      - version: v2.2.0
        displayVersion: v2.2.0
        url: '#'
      - version: v2.1.5
        displayVersion: v2.1.5
        url: '#'
      - version: v2.1.0
        displayVersion: v2.1.0
        url: '#'
      - version: v2.0.1
        displayVersion: v2.0.1
        url: '#'
      - version: v2.0.0
        displayVersion: v2.0.0
        missing: true
        url: '#'
  # Multi-version, current release is Stable but an OLDER one — a real
  # newer stable exists (`v2.4.0` below, `latest: true`). The current row
  # gets no pill at all: "Latest" would be wrong on it, and there is no
  # dedicated "Stable" pill in the design.
  stable-older:
    componentVersion:
      displayVersion: v2.3.1
      prerelease: false
      latest: false
    version: v2.3.1
    displayVersion: v2.3.1
    versions:
      - version: v2.4.0
        displayVersion: v2.4.0
        latest: true
        url: '#'
      - version: v2.3.1
        displayVersion: v2.3.1
        url: '#'
      - version: v2.1.5
        displayVersion: v2.1.5
        url: '#'
  # Multi-version, current release is a Prerelease with a Stable/latest
  # release also published — the common case (a `next`/beta channel next to
  # a stable line). Current row gets the orange "Prerelease" pill; toggle/
  # badge are `--prerelease`-orange.
  prerelease-current:
    componentVersion:
      displayVersion: v3.0.0-beta.1
      prerelease: true
      latest: false
    version: v3.0.0-beta.1
    displayVersion: v3.0.0-beta.1
    versions:
      - version: v3.0.0-beta.1
        displayVersion: v3.0.0-beta.1
        prerelease: true
        url: '#'
      - version: v2.4.0
        displayVersion: v2.4.0
        latest: true
        url: '#'
      - version: v2.3.1
        displayVersion: v2.3.1
        url: '#'
      - version: v2.1.5
        displayVersion: v2.1.5
        url: '#'
