version = 1
SPDX-PackageName = "docouture"
SPDX-PackageSupplier = "2025 INDUSTRIA DE DISEÑO TEXTIL S.A. (INDITEX S.A.)"
SPDX-PackageDownloadLocation = "https://github.com/InditexTech/weavejs"

[[annotations]]
path = [
    # root level licensing
    ".github/**",
    "REUSE.toml",
    "repolinter.json",

    # repeated files licensing
    "**/.gitignore",
    "**/tsconfig.json",
    "**/package*.json",
    "**/.eslintrc",

    # code/ directory licensing
    "code/packages/antora-extensions/**",
    "code/packages/ui-bundle/**",
    "code/.editorconfig",
    "code/.gitignore",
    "code/.eslintignore",
    "code/.prettierignore",
    "code/.prettierrc",
    "code/.tool-versions",
    "code/nx.json",
    "code/tsconfig.base.json",

    # docs/ directory licensing
    "docs/**",

    # agents files
    "AGENTS.md",
    ".agents/**",
    ".opencode/**",
    "skills/**",
]
SPDX-FileCopyrightText = "2025 INDUSTRIA DE DISEÑO TEXTIL S.A. (INDITEX S.A.)"
SPDX-License-Identifier = "Apache-2.0"
