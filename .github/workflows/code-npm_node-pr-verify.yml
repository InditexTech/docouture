name: code-npm-pr-verify

concurrency:
  group: code-npm-pr-verify-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Least privilege: this workflow only ever checks out the PR and runs
# read-only verification (changelog check, lint/test/build) — no step here
# pushes, comments, or otherwise writes back to GitHub, so the default
# broad token scope is more than it needs. `issues: read` and
# `pull-requests: read` are needed by the changelog-label check below, which
# reads the PR's own labels and, when it has none of its own, the labels of
# any issue it closes (see the `changelog` skill for why: a change's real
# `kind/*` category often lives on its tracking issue, not on the PR).
permissions:
  contents: read
  issues: read
  pull-requests: read

on:
  pull_request:
    paths:
      - "code/**"
      - ".github/workflows/code-npm_node-pr-verify.yml"

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ASDF_BRANCH_VERSION: 0.18.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 0 rather than the default shallow clone: the CHANGELOG.md check
          # below diffs against the PR's base commit, which needs to be
          # present locally, not just the tip being verified.
          fetch-depth: 0

      # Resolves whether this PR needs a CHANGELOG.md entry and, if so, whether
      # it's properly labeled — see the `changelog` skill for the full rules.
      # Six labels (`kind/enhancement`, `kind/bug`, `kind/documentation`,
      # `kind/deprecated`, `kind/removed`, `kind/security`) are "real"
      # categories that require an entry; `kind/internal` and `kind/epic` mean
      # no entry is needed. `skip-release` is NOT exempt here — it only blocks
      # the version bump (see `release-flow/keep-a-changelog-action`'s `bump`
      # command in the publish workflow), it does not exempt a PR from still
      # documenting its change in [Unreleased]. The PR's own labels are checked
      # first; if it carries none of the six real categories itself, this
      # falls back to the labels of any issue it closes (`closingIssuesReferences`
      # via the GraphQL API — not exposed by `gh pr view --json`), because the
      # real category commonly lives on the tracking issue while its
      # implementing PR(s) are deliberately `skip-release`. The exemption
      # (`kind/internal`/`kind/epic`) is resolved the same way — checked on
      # the PR AND on any issue it closes — since that label just as often
      # lives on the tracking issue rather than the implementing PR.
      - name: Resolve changelog requirement from labels
        id: changelog-requirement
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          CATEGORY_LABELS="kind/enhancement kind/bug kind/documentation kind/deprecated kind/removed kind/security"
          EXEMPT_LABELS="kind/internal kind/epic"

          has_any() {
            local haystack=",$1," needle
            for needle in $2; do
              [[ "$haystack" == *",$needle,"* ]] && return 0
            done
            return 1
          }

          issue_labels=$(gh api graphql -f query='
            query($owner:String!,$repo:String!,$num:Int!){
              repository(owner:$owner,name:$repo){
                pullRequest(number:$num){
                  closingIssuesReferences(first:10){ nodes { labels(first:20){ nodes { name } } } }
                }
              }
            }' -f owner="$REPO_OWNER" -f repo="$REPO_NAME" -F num="$PR_NUMBER" \
            --jq '[.data.repository.pullRequest.closingIssuesReferences.nodes[].labels.nodes[].name] | join(",")')

          needs_entry=false
          has_any "$PR_LABELS" "$CATEGORY_LABELS" && needs_entry=true
          has_any "$issue_labels" "$CATEGORY_LABELS" && needs_entry=true

          exempt=false
          has_any "$PR_LABELS" "$EXEMPT_LABELS" && exempt=true
          has_any "$issue_labels" "$EXEMPT_LABELS" && exempt=true

          echo "needs-entry=$needs_entry" >> "$GITHUB_OUTPUT"
          echo "exempt=$exempt" >> "$GITHUB_OUTPUT"

      # Homologated with weave.js's code-release_preview.yml: every PR that
      # touches code/** must add its own entry to CHANGELOG.md's [Unreleased]
      # section (code-npm_node-publish-release-and-snapshot.yml later promotes
      # that section wholesale — nothing is invented at release time).
      - name: Require CHANGELOG.md update
        if: ${{ steps.changelog-requirement.outputs.needs-entry == 'true' }}
        run: |
          if git diff --quiet "${{ github.event.pull_request.base.sha }}" HEAD -- code/CHANGELOG.md; then
            echo "::error title=No CHANGELOG.md changes::code/CHANGELOG.md's [Unreleased] section wasn't updated. Add an entry describing this change, or label the PR (or the issue it closes) 'kind/internal'/'kind/epic' if it has no user-facing effect. (skip-release alone does not exempt it — that label only blocks the version bump.)"
            exit 1
          fi

      # Catches the labeling gap the requirement-resolution step above can't
      # paper over: a PR that isn't exempt (not kind-internal/kind-epic-only)
      # but also has no real `kind/*` category anywhere — neither on itself
      # nor on an issue it closes. Without this, such a PR would silently
      # skip the CHANGELOG.md requirement above instead of failing loudly.
      - name: Require a changelog category label
        if: ${{ steps.changelog-requirement.outputs.needs-entry == 'false' && steps.changelog-requirement.outputs.exempt == 'false' }}
        run: |
          echo "::error title=Missing changelog category label::This PR needs one of kind/enhancement, kind/bug, kind/documentation, kind/deprecated, kind/removed or kind/security — on the PR itself or on an issue it closes — or kind/internal/kind/epic if it has no user-facing effect. (skip-release alone does not exempt it.)"
          exit 1

      # Homologated with weave.js's code-npm_node-PR_verify.yml: same asdf
      # setup pattern (cache keyed on .tool-versions, install skipped on
      # cache hit — see https://github.com/asdf-vm/actions/issues/356).
      # code/.tool-versions pins the `nodejs` / `pnpm` asdf plugins — `nodejs`,
      # not `node`, is the registered asdf-plugins short name.
      - name: pnpm / Setup Dependencies Cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('code/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: asdf / Setup Dependencies Cache
        uses: actions/cache@v4
        id: asdf-cache
        with:
          path: ~/.asdf
          key: ${{ runner.os }}-asdf-${{ env.ASDF_BRANCH_VERSION }}-${{ hashFiles('code/.tool-versions') }}

      - name: Save tool-versions content
        run: |
          {
            echo "TOOL_VERSIONS<<EOF"
            cat code/.tool-versions
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Setup asdf environment
        uses: asdf-vm/actions/install@1902764435ca0dd2f3388eea723a4f92a4eb8302 # v4.0.0
        # https://github.com/asdf-vm/actions/issues/356
        if: steps.asdf-cache.outputs.cache-hit != 'true'
        with:
          tool_versions: ${{ env.TOOL_VERSIONS }}
          asdf_version: ${{ env.ASDF_BRANCH_VERSION }}

      # On a cache hit the install step above is skipped, so nothing else
      # puts asdf's shims on PATH — pnpm/node would otherwise be
      # "command not found". Homologated with the identical step in
      # code-npm_node-publish-release-and-snapshot.yml.
      - name: Restore asdf shims to PATH
        if: steps.asdf-cache.outputs.cache-hit == 'true'
        run: |
          echo "$HOME/.asdf/bin" >> "$GITHUB_PATH"
          echo "$HOME/.asdf/shims" >> "$GITHUB_PATH"
          cp code/.tool-versions "$HOME/.tool-versions"

      # code/.npmrc pins the default registry to npmjs. The IOP Design System
      # (the only dependency that was ever on a different registry) is not
      # installed in this workspace — see code/tools/ids/README.md — so this
      # install needs no credential and never contacts Artifactory.
      - name: Install dependencies
        working-directory: code
        run: pnpm install --frozen-lockfile

      - name: NPM / Verify
        working-directory: code
        run: |
          npm run verify
