#
# Antora playbook — the entry point for building this site.
# Reference: https://docs.antora.org/antora/latest/playbook/
#
# Build with:  pnpm nx run @inditextech/docouture-example:build
# Output:      build/site
#

site:
  title: Weave.js
  # Set this to the public URL of the deployed site. It is required for the
  # sitemap and for canonical links. A path on it (`https://example.com/docs`)
  # publishes the site under that prefix: Antora records it as `site.path`,
  # and `scripts/dev.mjs` serves the site there so local URLs are the
  # deployed ones. The site's own first segment — /weavejs — is the
  # component name (docs/antora.yml), not this.
  #
  # Set to the local dev server's own origin so Antora also generates
  # 404.html (@antora/page-composer only does this when site.url is set) —
  # scripts/dev.mjs then has a real 404 page to serve. The docs workflow
  # passes `--url` when `vars.DOCS_SITE_URL` is set, which overrides this
  # with the real deployed URL for a production build.
  url: http://localhost:5000
  start_page: weavejs:ROOT:index.adoc
  # The header toolbar's repo link (see ui-bundle GH issue #7) reads
  # site.keys.repoUrl — playbook keys are camelCased, so it's authored here as
  # repo_url. Falls back to the content source's git remote (page.origin.webUrl)
  # when omitted.
  # keys:
  #   repo_url: https://github.com/example/example-docs
  keys:
    # Side-menu brand mark (nav-brand.hbs) — see the ui.supplemental_files
    # comment below for where product-logo.png comes from. Supplemental
    # files land under the UI's own output dir (ui.output_dir, default `_`),
    # not the site root, hence the `/_/` prefix.
    product_logo: /_/product-logo.png

    # The landing's decorative background (home.css). Same supplemental-file
    # route and the same `/_/` prefix as the logo above. The artwork is the
    # design's own, exported from Figma node 2696:54670; home.css paints it
    # full-bleed and fixed, and inverts it under the dark theme rather than
    # asking a site for a second asset.
    home_background: /_/home-background.jpg

    # Browser tab icon (head-icons.hbs), read by that partial as
    # site.keys.favicon. Cropped/padded from the same product-logo.png above
    # onto a square canvas — see supplemental-ui/ — rather than a second,
    # unrelated asset.
    favicon: /_/favicon.ico

content:
  sources:
    # This entry reads the AsciiDoc content that lives alongside this playbook.
    #
    # `url: .` points Antora at the enclosing git repository, so `start_path` is
    # resolved from the REPOSITORY ROOT, not from this file. That is why the
    # path below is fully qualified.
    #
    # When you copy this package into a repository of its own, the playbook ends
    # up at the repository root and this collapses to:
    #
    #   - url: .
    #     start_path: docs
    #     branches: [main]
    #     tags: ['docs/stable']
    #
    # GH-80: Mode 2 (Stable + Prerelease) — see versioning-modes.md. `main`
    # aggregates as the prerelease version (docs/antora.yml there permanently
    # says version: prerelease, prerelease: true); `tags: ['docs/stable']` is a
    # single pinned tag name, not a glob — a rolling tag that docouture-release.yml
    # force-moves to a fresh one-off commit on every release, rather than a
    # second long-lived branch. Its own docs/antora.yml (at whatever commit the
    # tag currently points to) says version: stable, prerelease: false.
    #
    # Switching to explicit ref names instead of HEAD means uncommitted local
    # edits under docs/ are no longer picked up automatically — see this
    # package's own SKILL.md ("Versions move in lockstep") for that trade-off.
    - url: ../../..
      start_path: code/packages/example/docs
      branches: [main]
      tags: ['docs/stable']

ui:
  bundle:
    # Local development: consume the UI bundle built by the sibling package.
    # `snapshot: true` tells Antora the bundle is a local build that changes,
    # so it must not be cached between runs.
    #
    # The build also emits a versioned `ui-bundle-<version>.zip` beside this
    # one. This unversioned copy exists so that this path does not have to be
    # edited on every version bump; `url` takes a literal path and does not
    # glob.
    url: ../ui-bundle/build/ui-bundle.zip
    snapshot: true
    #
    # Outside this monorepo, point at a published bundle instead — a release
    # artifact URL or a path to a downloaded zip. Prefer the versioned name
    # there, so the site records which bundle it was built against:
    #
    # url: https://example.com/docouture-ui-bundle/releases/0.1.0/ui-bundle-0.1.0.zip
    # snapshot: false
  # Serves the side-menu brand mark (nav-brand.hbs, site.keys.productLogo)
  # from a root-relative URL. The source is Weave.js's own logo
  # (docs/public/images/logo.png upstream) cropped to just its "W" symbol —
  # nav-brand.hbs's slot is a 40x40 product mark next to a separately
  # rendered text title, not a wide wordmark, and the full lockup already
  # duplicates that same "Weave.js" text. No dark variant: the isolated
  # mark's blue/teal gradient reads fine unchanged on a dark background: it
  # doesn't have the original wordmark's black text to invert for legibility.
  supplemental_files: ./supplemental-ui

output:
  dir: build/site
  # Remove the output directory before writing to it. Antora leaves whatever
  # is already there, so a page that has been renamed, moved to another module
  # or (as when this site's component was renamed) reachable under an entirely
  # different first URL segment keeps being served from a previous build.
  clean: true

urls:
  # Fumadocs served extensionless routes (/docs/sdk/...); indexify emits
  # .../index.html per page instead of page.html, so the migrated site keeps
  # the same URL shape rather than growing a .html suffix everywhere.
  html_extension_style: indexify

runtime:
  # Fail the build on broken xrefs and other content problems rather than
  # publishing a site with silent gaps.
  log:
    failure_level: warn

asciidoc:
  attributes:
    # Enable kbd:[], btn:[] and menu:[] macros.
    experimental: ''
    # Render admonition icons as font glyphs rather than text labels.
    icons: font
    # Add clickable anchors to section titles.
    sectanchors: ''
    idprefix: ''
    idseparator: '-'
    # GH-89: static, build-time syntax highlighting via Shiki instead of
    # Antora's own default (highlight.js, client-side) — see
    # @inditextech/docouture-asciidoc-extensions/lib/shiki-syntax-highlighter.js
    # for the adapter this name resolves to, and
    # @inditextech/docouture-antora-extensions/lib/shiki-prewarm.js (wired below,
    # under `antora.extensions`) for the async setup it depends on.
    source-highlighter: shiki
    # Turn on the ui-bundle's previous/next footer nav (pagination.hbs) for
    # every migrated page — it's opt-in per page there (a design decision,
    # not a bug), and none of the 450+ converted pages set it themselves.
    # `@` makes it a soft default so an individual page can still opt out
    # with `:!page-pagination:` if one ever needs to (e.g. a future landing
    # page).
    page-pagination: '@'
    # GH-44: renders `[mermaid]` blocks (the one-off Fumadocs migration left
    # 11 of them behind as literal diagram source; the migration tool itself
    # has since been removed, its job done) as real diagrams, via a
    # self-hosted Kroki service at the fixed local URL
    # @inditextech/docouture-asciidoc-extensions/lib/kroki-config.js hardcodes —
    # @inditextech/docouture-antora-extensions' kroki-prewarm.js starts it
    # automatically, no manual step needed. Only `mermaid` is enabled: that's
    # the only diagram type the migrated corpus actually uses; widening this
    # to a comma-separated list of more of kroki.js's `SUPPORTED_TYPES` may
    # also need a companion container added — copy that package's
    # resources/kroki-compose.yml to kroki-compose.yml right here (this
    # directory) to customize it; kroki-prewarm.js prefers that copy once it
    # exists.
    kroki-enabled: true
    kroki-diagram-types: mermaid
  extensions:
    # GH-14: `label:red[Text]` / `label:[Text]` (grey default) — an IDS
    # Label inline; `mono:[text]` — plain monospaced text, no code chip.
    # Both styled by ui-bundle's already-vendored CSS.
    - '@inditextech/docouture-asciidoc-extensions'

antora:
  extensions:
    # Reads `nav_modules` out of docs/antora.yml and stamps each navigation
    # tree with its module, title, description and icon, so the side menu can
    # show one module at a time with a switcher between them. Note this is a
    # different key from `asciidoc.extensions` above and a different kind of
    # extension: this one hooks Antora's own pipeline, that one hooks the
    # AsciiDoc processor. Listing either under the other's key makes Antora
    # log a warning and skip it.
    #
    # `changelog_path` overridden here: this playbook lives at
    # packages/example, three levels below the repo root, not one level
    # below it like docs/antora-playbook.yml — the default
    # `playbook.dir/../code/CHANGELOG.md` resolution only holds for the
    # latter. See changelog-pages.js's own header comment.
    - require: '@inditextech/docouture-antora-extensions'
      changelog_path: ../../CHANGELOG.md
