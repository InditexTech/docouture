version = 1
SPDX-PackageName = "docouture"
SPDX-PackageSupplier = "2026 INDUSTRIA DE DISEÑO TEXTIL S.A. (INDITEX S.A.)"
SPDX-PackageDownloadLocation = "https://github.com/InditexTech/docouture"

[[annotations]]
path = [
    # root level licensing
    ".github/**",
    "REUSE.toml",
    "repolinter.json",
    "README.md",
    "CONTRIBUTING.md",
    "justfile",
    "opencode.json",
    "skills-lock.json",

    # repeated files licensing
    "**/.gitignore",
    "**/tsconfig.json",
    "**/package*.json",
    "**/.eslintrc",

    # code/ directory licensing
    "code/packages/antora-extensions/**",
    "code/packages/example/**",
    "code/packages/cli/**",
    "code/packages/tooling/**",
    "code/packages/publish-gh-pages/**",
    "code/packages/asciidoc-extensions/**",
    "code/scripts/**",
    "code/authoring-guides/**",
    "code/README.md",
    "code/CHANGELOG.md",
    "code/pnpm-lock.yaml",
    "code/pnpm-workspace.yaml",
    "code/eslint.config.mjs",
    "code/.npmrc",
    "code/.editorconfig",
    "code/.gitignore",
    "code/.eslintignore",
    "code/.prettierignore",
    "code/.prettierrc",
    "code/.tool-versions",
    "code/nx.json",
    "code/tsconfig.base.json",

    # docs/ directory licensing
    "docs/**",

    # agents files
    "AGENTS.md",
    ".agents/**",
    ".opencode/**",
    "skills/**",
]
SPDX-FileCopyrightText = "2026 INDUSTRIA DE DISEÑO TEXTIL S.A. (INDITEX S.A.)"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
# ui-bundle: literal fork of antora-ui-default (MPL-2.0 upstream).
path = [
    "code/packages/ui-bundle/**",
]
SPDX-FileCopyrightText = "2026 INDUSTRIA DE DISEÑO TEXTIL S.A. (INDITEX S.A.)"
SPDX-License-Identifier = "MPL-2.0"
