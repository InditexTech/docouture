name: pr-verify

concurrency:
  group: pr-verify-${{ github.event.pull_request.number }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - "code/**"
      - ".github/workflows/pr-verify.yml"

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # code/.tool-versions pins `ivm-node` / `ivm-pnpm` — asdf plugin names that
      # only resolve on Inditex-provisioned machines. The version numbers are the
      # real pin; setup-node/pnpm read them directly rather than going through asdf,
      # so CI stays runnable on a public GitHub runner.
      - name: Read toolchain versions
        id: toolchain
        run: |
          {
            echo "node=$(awk '/^ivm-node /{print $2}' code/.tool-versions)"
            echo "pnpm=$(awk '/^ivm-pnpm /{print $2}' code/.tool-versions)"
          } >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ steps.toolchain.outputs.pnpm }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.toolchain.outputs.node }}
          cache: pnpm
          cache-dependency-path: code/pnpm-lock.yaml

      # code/.npmrc pins the default registry to npmjs. The IOP Design System
      # (the only dependency that was ever on a different registry) is not
      # installed in this workspace — see code/tools/ids/README.md — so this
      # install needs no credential and never contacts Artifactory.
      - name: Install dependencies
        working-directory: code
        run: pnpm install --frozen-lockfile

      - name: Verify
        working-directory: code
        run: |
          pnpm lint
          pnpm typecheck
          pnpm format:check
          pnpm nx run-many -t build --exclude=@inditextech/pdocs-example

      - name: Build example site (PR HEAD)
        working-directory: code/packages/example
        run: npx antora antora-playbook.local.yml
