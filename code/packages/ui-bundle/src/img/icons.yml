# Icons used by this bundle, drawn from Lucide (lucide-static, ISC licensed,
# public npm — see NOTICE).
#
# Each entry is the exact Lucide icon name — the same name `lucide.dev/icons/
# <name>` and `node_modules/lucide-static/icons/<name>.svg` use, and the same
# name `icon="<name>"` in an AsciiDoc `[card]` block or a nav module's
# `icon:` reference uses. There is no group and no variant suffix: Lucide
# ships one style per icon, unlike the icon set this replaced. The generated
# sprite's `<symbol>` id is `icon-<name>`.
#
# Use `just icons-search <term>` to find a name (searches Lucide's own tag
# index, offline, from the installed lucide-static package) — `just
# icons-build` fails with suggestions when a name is wrong.
#
#   just icons-search sidebar     find the right icon name
#   just icons-build              regenerate src/img/icons.svg
#
# Adding an icon is one line here plus `just icons-build`.

icons:
  - moon # theme toggle, dark
  - plus
  - arrow-left # pagination: previous; also the generic "back" affordance
  - circle-check-big # copy-to-clipboard success (06-copy-to-clipboard.ts); admonition: important (GH-13)
  - x # side-menu drawer close (GH-8, breakpoint xs); also recent-search remove (GH-69, 13-search-recents.ts), sized smaller there by CSS
  - code # nav switcher: the SDK module; [card,icon=…]: build/index.adoc Plugins
  - copy
  - maximize
  - minimize
  - search # header toolbar searcher, Home state (GH-18)
  - triangle-alert # admonition: warning (GH-13)
  - octagon-alert # admonition: caution (GH-13)
  - arrow-right # pagination: next
  - chevron-down
  - chevron-up
  - file # nav switcher: the TypeScript Types module
  - sticky-note # admonition: note (GH-13)
  - store # [card,icon=…]: build/index.adoc Stores
  - message-circle # admonition: tip (GH-13)
  - cloud # nav switcher: the Azure Web PubSub Store module
  - link # section anchor / copy link
  - external-link
  - wifi # nav switcher: the Websockets Store module
  - circle-play
  - grid-3x3 # nav switcher: the Framework module
  - menu # side-menu toggle (GH-8)
  - panel-left # "on this page" toggle
  - wrench # nav switcher: the React Helper module
  - house
  - server # nav switcher: the Standalone Store module
  - flame # [card,icon=…]: build/index.adoc Actions
  - shapes # [card,icon=…]: build/index.adoc Nodes
  - rotate-ccw-clock # recent searches heading (GH-69, 13-search-recents.ts)
  - sun # theme toggle, light

# Icons that also need a CSS-consumable form (a `--icon-mask-<name>` custom
# property, plus a `.dt-icon-mask--<name>` utility class, both generated into
# src/css/icon-masks.css). Two kinds of markup need this:
#
#   - markup Asciidoctor generates itself, where the `{{icon}}` helper's
#     `<svg><use>` has no way in — admonitions with `icons: font` (both
#     playbooks) are fixed at `<i class="fa icon-note" title="Note">`. See
#     GH-13.
#   - markup an Asciidoctor EXTENSION emits, which runs at conversion time with
#     no `uiRootPath` and so cannot address the sprite at all. The `[card]`
#     block's `icon=` attribute draws from this list, and `just icons-build`
#     fails when a page names an icon that is not masked here (GH-20).
#
# Every entry must also be listed under `icons:` above; `just icons-build`
# fails otherwise.
masks:
  - circle-check-big
  - code # [card,icon=…] (GH-20)
  - triangle-alert
  - octagon-alert
  - chevron-down # collapsible marker (GH-15)
  - file # [card,icon=…] (GH-20)
  - sticky-note
  - store # [card,icon=…] (GH-20)
  - message-circle
  - external-link # [feature-tabs] call to action, external targets (GH-22)
  - grid-3x3 # [card,icon=…] (GH-20)
  - server # [card,icon=…] (GH-20)
  - flame # [card,icon=…] (GH-20)
  - shapes # [card,icon=…] (GH-20)
