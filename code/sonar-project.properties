# SonarQube Cloud (SonarCloud) configuration
# Read automatically by the SonarScanner from the base directory (code/).
#
# NOTE: The project identity and server settings (sonar.host.url,
# sonar.organization, sonar.projectKey, sonar.projectName) are intentionally
# NOT defined here. They are enforced from the CI workflow via -D command line
# arguments (which take precedence over this file) so they cannot be altered
# by editing this file.
#
# Dynamic values (projectVersion, branch / pull request scope) are also passed
# from the workflow via -D command line arguments.
# Docs: https://docs.sonarsource.com/sonarqube-cloud/analyzing-source-code/scanners/sonarscanner-for-npm/configuring

# Source and test layout (monorepo packages, base dir = code/)
# Specs in this repo are named *.spec.js / *.spec.ts (never *.test.*) — see
# packages/{antora-extensions,cli,tooling,publish-gh-pages}/**/*.spec.{js,ts}.
sonar.sources=packages
sonar.tests=packages
sonar.test.inclusions=**/*.spec.js,**/*.spec.ts

# Files excluded from analysis. packages/example is a hand-authored docs
# fixture (Next.js snippets embedded in AsciiDoc guides, e.g.
# packages/example/src/modules/main/examples/manual-installation/**) — not
# application code this repo owns, builds or tests.
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/reports/**,**/*.test-d.ts,packages/example/**

# Files excluded from coverage computation. packages/ui-bundle/gulp.d/** and
# packages/ui-bundle/scripts/** are the bundle's own build tooling (gulp
# tasks, the icon-sprite builder) — it runs only at build time, not code
# this repo ships to a browser or an Antora page render, so it's held to
# Sonar's regular reliability/maintainability/duplication checks but not to
# the coverage gate. packages/cli/templates/** is scaffold content copied
# into OTHER projects by `docouture new` — outside cli's own tsconfig.json
# (`rootDir`/`include` is `src/**` only) and outside vitest's own
# `include` glob (`src/**/*.spec.ts`), the same "not application code this
# repo owns, builds or tests" reasoning packages/example already documents
# above.
sonar.coverage.exclusions=**/__tests__/**,**/*.config.{js,ts},**/vitest.setup.ts,packages/example/**,\
  packages/ui-bundle/gulp.d/**,packages/ui-bundle/scripts/**,packages/cli/templates/**

# Files excluded from duplication detection
sonar.cpd.exclusions=packages/example/**,**/vitest.config.{js,ts},**/vitest.setup.ts,**/__tests__/**,**/*.spec.{js,ts}

# Merged LCOV coverage report (relative to base dir = code/)
sonar.javascript.lcov.reportPaths=coverage/lcov.info


