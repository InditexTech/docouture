name: pr-verify

concurrency:
  group: pr-verify-${{ github.event.pull_request.number }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - "code/**"
      - ".github/workflows/pr-verify.yml"

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 0 rather than the default shallow clone: the CHANGELOG.md check
          # below diffs against the PR's base commit, which needs to be
          # present locally, not just the tip being verified.
          fetch-depth: 0

      # Homologated with weave.js's code-release_preview.yml: every PR that
      # touches code/** must add its own entry to CHANGELOG.md's [Unreleased]
      # section (code-npm_node-publish-release-and-snapshot.yml later promotes
      # that section wholesale — nothing is invented at release time).
      # `skip-release` is the documented escape hatch for PRs with no
      # user-facing effect (internal tooling, CI config, etc.) — same label
      # that workflow itself already recognizes.
      - name: Require CHANGELOG.md update
        if: ${{ !contains(join(github.event.pull_request.labels.*.name, ', '), 'skip-release') }}
        run: |
          if git diff --quiet "${{ github.event.pull_request.base.sha }}" HEAD -- code/CHANGELOG.md; then
            echo "::error title=No CHANGELOG.md changes::code/CHANGELOG.md's [Unreleased] section wasn't updated. Add an entry describing this change, or label the PR 'skip-release' if it has no user-facing effect."
            exit 1
          fi

      # code/.tool-versions pins `ivm-node` / `ivm-pnpm` — asdf plugin names that
      # only resolve on Inditex-provisioned machines. The version numbers are the
      # real pin; setup-node/pnpm read them directly rather than going through asdf,
      # so CI stays runnable on a public GitHub runner.
      - name: Read toolchain versions
        id: toolchain
        run: |
          {
            echo "node=$(awk '/^ivm-node /{print $2}' code/.tool-versions)"
            echo "pnpm=$(awk '/^ivm-pnpm /{print $2}' code/.tool-versions)"
          } >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ steps.toolchain.outputs.pnpm }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.toolchain.outputs.node }}
          cache: pnpm
          cache-dependency-path: code/pnpm-lock.yaml

      # code/.npmrc pins the default registry to npmjs. The IOP Design System
      # (the only dependency that was ever on a different registry) is not
      # installed in this workspace — see code/tools/ids/README.md — so this
      # install needs no credential and never contacts Artifactory.
      - name: Install dependencies
        working-directory: code
        run: pnpm install --frozen-lockfile

      - name: Verify
        working-directory: code
        run: |
          pnpm lint
          pnpm typecheck
          pnpm format:check
          pnpm nx run-many -t build --exclude=@inditextech/pdocs-example
          pnpm nx run-many -t test

      - name: Build example site (PR HEAD)
        working-directory: code/packages/example
        run: npx antora antora-playbook.local.yml
