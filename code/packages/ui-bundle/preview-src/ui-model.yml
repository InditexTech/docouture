#
# Hand-written fixture standing in for what Antora computes at build time.
# Rewritten to be design-shaped (see .figma design linked from GH issue #1 /
# #8) rather than the inherited antora-ui-default sample: one product, the
# Figma side-menu tree, a "Stable - Latest" version tag and a repo link.
#
# YAML anchors are load-bearing, not decorative: `nav-explore.hbs` compares
# the current component/version against `site.components[].versions[]` with
# the `eq` helper, which for objects is identity — so "the latest version"
# and "the version this page is on" must be the SAME node for `is-current`
# and `is-latest` to light up. Keep every `is-current` / `is-latest` case
# wired through an anchor, not a value that merely looks equal.
#
# Intentionally thin: `site.keys` (beyond `repoUrl`), `page.attributes` and
# `asciidoc.extensions` are populated per-page by build-preview-pages.js, not
# here. If you add a partial that reads a branch this fixture doesn't cover,
# extend it — don't let the gap surface for the first time in a real build.
#
antoraVersion: '1.0.0'
site:
  url: http://localhost:5252
  title: Atd Docs
  homeUrl: &home_url /landing.html
  keys:
    repoUrl: https://github.com/InditexTech/atd-docs
  components:
    - &component
      name: atd
      title: &component_title ATD
      url: *home_url
      versions:
        - &latest_version
          title: *component_title
          url: *home_url
          version: stable
          displayVersion: Stable - Latest
        - url: '#'
          version: '2024.1'
          displayVersion: '2024.1'
      latestVersion: *latest_version
    - name: platform
      title: Platform
      url: '#'
      versions:
        - &platform_version
          url: '#'
          version: '3.4'
          displayVersion: '3.4'
      latestVersion: *platform_version
page:
  url: *home_url
  home: true
  title: Hardware and Software Requirements
  component: *component
  componentVersion: *latest_version
  version: stable
  displayVersion: Stable - Latest
  module: ROOT
  relativeSrcPath: index.adoc
  editUrl: https://github.com/InditexTech/atd-docs/edit/main/docs/modules/ROOT/pages/index.adoc
  origin:
    private: false
  previous:
    content: Getting started
    url: '#'
    urlType: internal
  next:
    content: Features
    url: '#'
    urlType: internal
  breadcrumbs:
    - content: Overview
      url: '#'
      urlType: fragment
    - content: Hardware and Software Requirements
      url: *home_url
      urlType: internal
  versions:
    - version: stable
      displayVersion: Stable - Latest
      url: '#'
    - version: '2024.1'
      displayVersion: '2024.1'
      url: '#'
    - version: '2023.2'
      displayVersion: '2023.2'
      missing: true
      url: '#'
  # Mirrors the Figma side menu (see GH issue #8): top-level entries plus one
  # nested branch under "Components", so nav-tree recursion and the
  # `.ids-list-item--tree--level-N` indentation both get exercised without
  # the fixture needing a rewrite on every design tweak.
  navigation:
    - root: true
      items:
        - content: Overview
          url: *home_url
          urlType: internal
        - content: Getting started
          url: '#getting-started'
          urlType: fragment
        - content: Features
          url: '#features'
          urlType: fragment
        - content: Components
          items:
            - content: Architecture overview
              url: '#architecture-overview'
              urlType: fragment
            - content: Supported artifacts
              url: '#supported-artifacts'
              urlType: fragment
            - content: Teams
              url: '#teams'
              urlType: fragment
            - content: Virtual Threads
              url: '#virtual-threads'
              urlType: fragment
            - content: Resilience
              url: '#resilience'
              urlType: fragment
            - content: Administration
              url: '#administration'
              urlType: fragment
            - content: Tasks and notifications
              url: '#tasks-and-notifications'
              urlType: fragment
        - content: Roles and Permissions
          url: '#roles-and-permissions'
          urlType: fragment
        - content: Templates
          url: '#templates'
          urlType: fragment
        - content: Integrations
          url: '#integrations'
          urlType: fragment
        - content: Additional Information
          url: '#additional-information'
          urlType: fragment
