#
# Antora playbook — the entry point for building this site.
# Reference: https://docs.antora.org/antora/latest/playbook/
#
# Build with:  npx antora --fetch antora-playbook.yml
# Output:      build/site
#

site:
  title: __PDOCS_TITLE__
  # Set this to the public URL of the deployed site. It is required for the
  # sitemap and for canonical links; leave it out while developing locally.
  # url: https://docs.example.com
  start_page: __PDOCS_NAME__::index.adoc

content:
  sources:
    # `url: .` points Antora at the enclosing git repository, so `start_path`
    # is resolved from the repository root.
    - url: .
      start_path: docs
      # HEAD means "whatever is checked out", so local edits are picked up
      # without committing them. Antora reads content from git, so the
      # repository needs at least one commit or the site builds with zero
      # pages — `pdocs new` makes that commit for you if this directory
      # was not already inside a git repository.
      branches: HEAD

ui:
  bundle:
    # Antora's own reference UI, so this site builds immediately with no
    # further setup. Swap in a different bundle once you have one, for
    # example the pdocs UI bundle:
    #
    #   url: https://example.com/pdocs-ui-bundle/releases/0.1.0/ui-bundle-0.1.0.zip
    #   snapshot: false
    url: https://gitlab.com/antora/antora-ui-default/-/jobs/artifacts/master/raw/build/ui-bundle.zip?job=bundle-stable
    snapshot: true

output:
  dir: build/site

runtime:
  # Fail the build on broken xrefs and other content problems rather than
  # publishing a site with silent gaps.
  log:
    failure_level: warn

asciidoc:
  attributes:
    # Enable kbd:[], btn:[] and menu:[] macros.
    experimental: ''
    # Render admonition icons as font glyphs rather than text labels.
    icons: font
    # Add clickable anchors to section titles.
    sectanchors: ''
    idprefix: ''
    idseparator: '-'
