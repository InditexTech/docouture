      - article [ref=e62]:
        - generic [ref=e63]:
          - heading "Building blocks" [level=2] [ref=e64]
          - generic [ref=e65]:
            - paragraph [ref=e67]:
              - text: A building block is typically a simple, well-defined unit—like a shape, a UI component, or a plugin—that does one thing well. You can mix and match these blocks to assemble more advanced features or entire applications.
              - strong [ref=e68]: Weave.js
              - text: "provides a set of well-defined building blocks:"
            - generic [ref=e69]:
              - generic [ref=e74]:
                - link "Nodes" [ref=e76] [cursor=pointer]:
                  - /url: nodes/
                - paragraph [ref=e77]: Nodes are the fundamental visual building blocks in Weave.js. They are primarily based on Konva.js primitives (shapes and groups) and represent everything rendered on the canvas.
              - generic [ref=e82]:
                - link "Plugins" [ref=e84] [cursor=pointer]:
                  - /url: plugins/
                - paragraph [ref=e85]: Plugins extend and enhance Weave.js’s core functionality. Whether it’s selection handling, canvas panning, zooming, or custom behaviors, plugins allow you to modular add or override features without cluttering the core logic.
              - generic [ref=e90]:
                - link "Actions" [ref=e92] [cursor=pointer]:
                  - /url: actions/
                - paragraph [ref=e93]: Actions are how user interactions are interpreted and executed within Weave.js. From adding new Nodes to the canvas to triggering selection or transformation, Actions provide a clean and consistent way to handle event-driven logic.
              - generic [ref=e98]:
                - link "Stores" [ref=e100] [cursor=pointer]:
                  - /url: stores/
                - paragraph [ref=e101]: Stores are responsible for managing the shared-state, persist it and the real-time communication between peers. A Store on the backend, manages the application’s shared-state, real-time synchronization and persistence, on the frontend, a client is provided to connect to the backend.
