---
# Same name, filename and job shape as weave.js's
# code-npm_node-publish-release-and-snapshot.yml, so the two repos' release
# processes read identically at a glance. Divergences from the weave.js
# original are called out inline where pdocs' toolchain (pnpm/nx/just instead
# of plain npm scripts) or its site-generator nature (a ui-bundle release
# artifact, no npm-publish precedent yet to gate) forces one. See
# docs/code-npm_node-publish-release-and-snapshot.md for the job-by-job walkthrough.
name: code-npm-publish-release-and-snapshot
run-name: "Publish workflow: ${{ github.event_name }}"

on:
  issue_comment:
    types: [created]
  pull_request:
    types: [closed]
    branches: ["main", "main-*"]
    paths: ["code/**", ".github/workflows/code**"]
  workflow_dispatch:
    inputs:
      BASELINE:
        description: "Baseline branch"
        required: true
        default: "main"
      RELEASE_TYPE:
        description: "Release type to use"
        required: true
        default: "release-type/minor"
        type: choice
        options:
          - "release-type/hotfix"
          - "release-type/multi-hotfix"
          - "release-type/major"
          - "release-type/minor"
          - "release-type/patch"

jobs:
  publish-snapshot:
    name: Publish Snapshot
    concurrency: code-publish-snapshot-${{ github.ref }}
    permissions:
      id-token: write
      contents: read
      issues: write
      pull-requests: write
    if: >
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request != null &&
      github.event.comment.body == '/publish-snapshot'
    runs-on: ubuntu-24.04
    env:
      ASDF_BRANCH_VERSION: 0.18.0
    steps:
      - name: Validate admin permissions
        id: permission-check
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: context.actor
            });

            const permission = data.permission;
            core.info(`User permission level: ${permission}`);

            if (permission !== 'admin') {
              core.setFailed(`User @${context.actor} is not a repository admin.`);
            }

      - name: Get input parameters
        run: |
          RELEASE_LABELS="${{ join(github.event.issue.labels.*.name, ', ') }}"
          if [[ $RELEASE_LABELS != *release-type/* ]]; then
            RELEASE_LABELS="$RELEASE_LABELS, release-type/minor"
          fi
          echo "RELEASE_LABELS=$RELEASE_LABELS" >> "$GITHUB_ENV"

      - name: Checkout PR branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head
          fetch-depth: 0
          persist-credentials: false

      # pdocs uses pnpm, not npm, for its own dependency install — cache the
      # pnpm store instead of weave.js's ~/.npm, keyed off pnpm-lock.yaml.
      - name: pnpm / Setup Dependencies Cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('code/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Restore asdf Cache
        id: asdf-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        continue-on-error: true
        with:
          path: ~/.asdf
          key: ${{ runner.os }}-asdf-${{ env.ASDF_BRANCH_VERSION }}-${{ hashFiles('code/.tool-versions') }}

      # code/.tool-versions pins the `nodejs` / `pnpm` asdf plugins. `nodejs`,
      # not `node`, is the registered asdf-plugins short name — using `node`
      # here fails with "plugin node not found in repository". Homologated
      # with weave.js's code-npm_node-publish-release-and-snapshot.yml and
      # pdocs' own code-npm_node-pr-verify.yml, which use the identical asdf setup pattern.
      - name: Save tool-versions content
        run: |
          {
            echo "TOOL_VERSIONS<<EOF"
            cat code/.tool-versions
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Setup asdf environment
        uses: asdf-vm/actions/install@1902764435ca0dd2f3388eea723a4f92a4eb8302 # v4.0.0
        if: steps.asdf-cache.outputs.cache-hit != 'true'
        with:
          tool_versions: ${{ env.TOOL_VERSIONS }}
          asdf_version: ${{ env.ASDF_BRANCH_VERSION }}

      - name: Save asdf Cache
        if: steps.asdf-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.asdf
          key: ${{ runner.os }}-asdf-${{ env.ASDF_BRANCH_VERSION }}-${{ hashFiles('code/.tool-versions') }}

      - name: Restore asdf shims to PATH
        if: steps.asdf-cache.outputs.cache-hit == 'true'
        run: |
          echo "$HOME/.asdf/bin" >> "$GITHUB_PATH"
          echo "$HOME/.asdf/shims" >> "$GITHUB_PATH"
          cp code/.tool-versions "$HOME/.tool-versions"

      - name: NPM / Set npmrc registry
        env:
          NPM_REGISTRY: "https://registry.npmjs.org/"
        run: |
          echo "registry=${NPM_REGISTRY}" >> /home/runner/.npmrc
          echo "@inditextech:registry=${NPM_REGISTRY}" >> /home/runner/.npmrc

      - name: NPM / Create Cache Folders
        run: |
          mkdir -p "$HOME"/.npm

      - name: Install dependencies
        working-directory: code
        run: pnpm install --frozen-lockfile

      - name: Setup patch release type version
        if: contains(env.RELEASE_LABELS, 'release-type/hotfix')
          || contains(env.RELEASE_LABELS, 'release-type/multi-hotfix')
          || contains(env.RELEASE_LABELS, 'release-type/patch')
        run: echo "RELEASE_VERSION=patch" >> "$GITHUB_ENV"

      - name: Setup minor release type version
        if: contains(env.RELEASE_LABELS, 'release-type/minor')
        run: echo "RELEASE_VERSION=minor" >> "$GITHUB_ENV"

      - name: Setup major release type version
        if: contains(env.RELEASE_LABELS, 'release-type/major')
        run: echo "RELEASE_VERSION=major" >> "$GITHUB_ENV"

      - name: Update CHANGELOG.md
        id: update-changelog
        uses: release-flow/keep-a-changelog-action@74931dec7ecdbfc8e38ac9ae7e8dd84c08db2f32 # v3.0.0
        with:
          command: bump
          version: ${{ env.RELEASE_VERSION }}
          changelog: code/CHANGELOG.md
          fail-on-empty-release-notes: false
          keep-unreleased-section: true
          tag-prefix: ""

      - name: Define snapshot version
        working-directory: code
        env:
          RELEASE_VERSION: ${{ steps.update-changelog.outputs.version }}
        run: |
          CLEAN_VERSION=$(echo "$RELEASE_VERSION" | sed -E 's/-.*$//')
          PRE_RELEASE_VERSION="${CLEAN_VERSION}-SNAPSHOT.${{ github.run_number }}.${{ github.run_attempt }}"
          echo "SNAPSHOT_VERSION=$PRE_RELEASE_VERSION" >> "$GITHUB_ENV"

      # Homologated with weave.js's `npm run version:release` +
      # `npm run release:prepare` step pair. code/package.json's scripts of
      # the same name are just-free wrappers around `pnpm version` (see
      # justfile's `bump` recipe for the human-facing equivalent) so this
      # doesn't need `just` installed on the runner.
      - name: NPM / Prepare release
        working-directory: code
        env:
          RELEASE_VERSION: ${{ env.SNAPSHOT_VERSION }}
        run: |
          npm run version:release
          npm run release:prepare

      - name: NPM / Ensure minimum npm version for trusted publishing
        run: |
          CURRENT_NPM=$(npm --version)
          REQUIRED_NPM="11.5.1"
          if printf '%s\n%s\n' "$REQUIRED_NPM" "$CURRENT_NPM" | sort -V -C; then
            echo "npm $CURRENT_NPM already meets the minimum requirement ($REQUIRED_NPM). Skipping upgrade."
          else
            echo "npm $CURRENT_NPM is below the minimum requirement ($REQUIRED_NPM). Upgrading…"
            npm install -g npm@^11.5.1 --registry="https://registry.npmjs.org/"
            asdf reshim nodejs
          fi
          echo "node path: $(command -v node)"
          echo "npm path: $(command -v npm)"
          node --version
          npm --version

      # The publishable package list is derived from `packages/*/package.json`'s
      # `private` field by scripts/publishable-packages.mjs — see justfile's
      # `release-local` recipe for the human-facing equivalent. `example` is
      # `private: true` and excluded automatically.
      #
      # This step also hard-fails the whole job, before any package is
      # published, if the target version (already bumped into each
      # package.json by "NPM / Prepare release", above) is found already
      # published for any package. Without this pre-check, a mid-loop
      # "already published" failure in the publish steps below would leave
      # earlier packages in the loop live on the registry while later ones
      # never get published in the same run — this check makes that
      # partial-publish state impossible to reach.
      - name: NPM / Verify packages exist in registry
        id: verify-packages
        working-directory: code
        run: |
          mapfile -t PACKAGES < <(node scripts/publishable-packages.mjs)
          MISSING=()
          ALREADY_PUBLISHED=()
          for pkg in "${PACKAGES[@]}"; do
            PKG_NAME=$(node -p "require('./packages/$pkg/package.json').name")
            TARGET_VERSION=$(node -p "require('./packages/$pkg/package.json').version")
            ENCODED_PKG_NAME=$(node -p "encodeURIComponent(process.argv[1])" "$PKG_NAME")
            RESPONSE_FILE=$(mktemp)
            if ! HTTP_STATUS=$(curl -sS -o "$RESPONSE_FILE" -w "%{http_code}" \
              --connect-timeout 10 \
              --max-time 30 \
              --retry 3 \
              --retry-delay 2 \
              --retry-all-errors \
              "https://registry.npmjs.org/${ENCODED_PKG_NAME}"); then
              echo "::error::Failed to verify $PKG_NAME due to npm registry connectivity error"
              rm -f "$RESPONSE_FILE"
              exit 1
            fi
            case "$HTTP_STATUS" in
              200)
                PARSE_STATUS=0
                node -e "
                  try {
                    const d = JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8'));
                    const versions = Object.keys(d.versions || {});
                    if (versions.length === 0) process.exit(1);
                    if (versions.includes(process.argv[2])) process.exit(3);
                    process.exit(0);
                  } catch (e) {
                    console.error('JSON parse error:', e.message);
                    process.exit(2);
                  }
                " "$RESPONSE_FILE" "$TARGET_VERSION" || PARSE_STATUS=$?
                case "$PARSE_STATUS" in
                  0)
                    echo "✓ $PKG_NAME exists in registry, target version $TARGET_VERSION not yet published"
                    ;;
                  1)
                    echo "✗ $PKG_NAME has no active versions (unpublished) — treating as new"
                    MISSING+=("$PKG_NAME")
                    ;;
                  3)
                    echo "::error::$PKG_NAME@$TARGET_VERSION is already published"
                    ALREADY_PUBLISHED+=("$PKG_NAME@$TARGET_VERSION")
                    ;;
                  *)
                    echo "::error::Failed to verify $PKG_NAME — npm registry returned invalid JSON (HTTP 200)"
                    rm -f "$RESPONSE_FILE"
                    exit 1
                    ;;
                esac
                ;;
              404)
                echo "✗ $PKG_NAME NOT found in registry"
                MISSING+=("$PKG_NAME")
                ;;
              429|5??)
                echo "::error::Failed to verify $PKG_NAME due to transient npm registry error (HTTP $HTTP_STATUS)"
                exit 1
                ;;
              *)
                echo "::error::Failed to verify $PKG_NAME due to unexpected npm registry response (HTTP $HTTP_STATUS)"
                exit 1
                ;;
            esac
            rm -f "$RESPONSE_FILE"
          done
          if [[ ${#ALREADY_PUBLISHED[@]} -gt 0 ]]; then
            echo "::error::Refusing to publish anything this run — already published: ${ALREADY_PUBLISHED[*]}"
            exit 1
          fi
          if [[ ${#MISSING[@]} -gt 0 ]]; then
            echo "MISSING_PACKAGES=${MISSING[*]}" >> "$GITHUB_ENV"
            echo "HAS_NEW_PACKAGES=true" >> "$GITHUB_ENV"
            echo "::warning::New packages detected: ${MISSING[*]} — will use NPM_TOKEN instead of OIDC"
          else
            echo "HAS_NEW_PACKAGES=false" >> "$GITHUB_ENV"
            echo "All packages verified in registry — OIDC publish is safe."
          fi

      - name: Build
        working-directory: code
        run: pnpm build

      # weave.js's equivalent is a single `npm run publish:snapshot` fanning
      # out across nx targets; pdocs has no publish nx target, so this loops
      # `pnpm publish` over scripts/publishable-packages.mjs's list directly.
      # `pnpm publish` (not `npm publish`) is required: it rewrites each
      # package's `workspace:*` cross-references to the resolved version at
      # pack time — `npm publish` ships the literal string, which breaks
      # installs in any consuming repo that isn't itself a pnpm workspace.
      - name: NPM / Publish Snapshot (OIDC + provenance)
        if: env.HAS_NEW_PACKAGES == 'false'
        env:
          NPM_CONFIG_PROVENANCE: "true"
        working-directory: code
        run: |
          set -euo pipefail
          mapfile -t PACKAGES < <(node scripts/publishable-packages.mjs)
          for pkg in "${PACKAGES[@]}"; do
            (cd "packages/$pkg" && pnpm publish --access public --tag next --no-git-checks)
          done

      - name: NPM / Publish Snapshot (NPM_TOKEN for new packages)
        if: env.HAS_NEW_PACKAGES == 'true'
        env:
          NPM_AUTH: ${{ secrets.NPM_TOKEN }}
        working-directory: code
        run: |
          if [ -z "${NPM_AUTH:-}" ]; then
            echo "::error::NPM_TOKEN secret is required for publishing new packages but is not set"
            exit 1
          fi
          TEMP_NPMRC="$(mktemp)"
          trap 'rm -f "$TEMP_NPMRC"' EXIT
          cp ~/.npmrc "$TEMP_NPMRC"
          chmod 600 "$TEMP_NPMRC"
          echo "//registry.npmjs.org/:_authToken=${NPM_AUTH}" >> "$TEMP_NPMRC"
          export NPM_CONFIG_USERCONFIG="$TEMP_NPMRC"
          set -euo pipefail
          mapfile -t PACKAGES < <(node scripts/publishable-packages.mjs)
          for pkg in "${PACKAGES[@]}"; do
            (cd "packages/$pkg" && pnpm publish --access public --tag next --no-git-checks)
          done

      - name: Result / Comment on PR
        if: always()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const status = '${{ job.status }}';
            const authMethod = '${{ env.HAS_NEW_PACKAGES }}' === 'true'
              ? 'NPM_TOKEN (new packages detected)'
              : 'OIDC trusted publishing (provenance)';

            const body = status === 'success'
              ? [
                  "### :rocket: NPM snapshot published",
                  "",
                  `- Version: \`${{ env.SNAPSHOT_VERSION }}\``,
                  "- Tag: `next`",
                  `- Auth: ${authMethod}`
                ]
              : [
                  "### :x: NPM snapshot publication failed",
                  "",
                  "Please check the workflow logs for details."
                ]

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body.join("\n")
            });

  release:
    name: Release
    concurrency: code-release-${{ github.ref }}
    permissions:
      id-token: write
      contents: write
      issues: write
      pull-requests: write
    if: github.event_name == 'workflow_dispatch'
      || (github.event_name == 'pull_request' && github.event.pull_request.merged == true
      && !contains(join(github.event.pull_request.labels.*.name, ', '), 'skip-release')
      && contains(join(github.event.pull_request.labels.*.name, ', '), 'release-type'))
    runs-on: ubuntu-24.04
    env:
      ASDF_BRANCH_VERSION: 0.18.0
    steps:
      - name: Validate admin permissions
        id: permission-check
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: context.actor
            });

            const permission = data.permission;
            core.info(`User permission level: ${permission}`);

            if (permission !== 'admin') {
              core.setFailed(`User @${context.actor} is not a repository admin.`);
            }

      - name: Get input parameters
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            RELEASE_LABELS="${{ github.event.inputs.RELEASE_TYPE }}"
          else
            RELEASE_LABELS="${{ join(github.event.pull_request.labels.*.name, ', ') }}"
          fi
          echo "RELEASE_LABELS=$RELEASE_LABELS" >> "$GITHUB_ENV"
          # For a merged PR, GitHub has already fast-forwarded the base branch
          # by the time `closed` fires, so checking the branch out by name
          # (not the ephemeral PR merge ref) gets the real, just-merged commit.
          BASELINE_BRANCH=${{ github.event.inputs.BASELINE || github.event.pull_request.base.ref || 'main' }}
          echo "BASELINE_BRANCH=${BASELINE_BRANCH#refs/heads/}" >> "$GITHUB_ENV"

      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout baseline branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ env.BASELINE_BRANCH }}
          fetch-depth: 0
          persist-credentials: false

      - name: pnpm / Setup Dependencies Cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('code/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Restore asdf Cache
        id: asdf-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        continue-on-error: true
        with:
          path: ~/.asdf
          key: ${{ runner.os }}-asdf-${{ env.ASDF_BRANCH_VERSION }}-${{ hashFiles('code/.tool-versions') }}

      - name: Save tool-versions content
        run: |
          {
            echo "TOOL_VERSIONS<<EOF"
            cat code/.tool-versions
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Setup asdf environment
        uses: asdf-vm/actions/install@1902764435ca0dd2f3388eea723a4f92a4eb8302 # v4.0.0
        if: steps.asdf-cache.outputs.cache-hit != 'true'
        with:
          tool_versions: ${{ env.TOOL_VERSIONS }}
          asdf_version: ${{ env.ASDF_BRANCH_VERSION }}

      - name: Save asdf Cache
        if: steps.asdf-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.asdf
          key: ${{ runner.os }}-asdf-${{ env.ASDF_BRANCH_VERSION }}-${{ hashFiles('code/.tool-versions') }}

      - name: Restore asdf shims to PATH
        if: steps.asdf-cache.outputs.cache-hit == 'true'
        run: |
          echo "$HOME/.asdf/bin" >> "$GITHUB_PATH"
          echo "$HOME/.asdf/shims" >> "$GITHUB_PATH"
          cp code/.tool-versions "$HOME/.tool-versions"

      - name: NPM / Set npmrc registry
        env:
          NPM_REGISTRY: "https://registry.npmjs.org/"
        run: |
          echo "registry=${NPM_REGISTRY}" >> /home/runner/.npmrc
          echo "@inditextech:registry=${NPM_REGISTRY}" >> /home/runner/.npmrc

      - name: NPM / Create Cache Folders
        run: |
          mkdir -p "$HOME"/.npm

      - name: Install dependencies
        working-directory: code
        run: pnpm install --frozen-lockfile

      - name: Verify before releasing
        working-directory: code
        run: |
          pnpm lint
          pnpm typecheck
          pnpm format:check
          pnpm nx run-many -t test

      - name: Setup patch release type version
        if: contains(env.RELEASE_LABELS, 'release-type/hotfix')
          || contains(env.RELEASE_LABELS, 'release-type/multi-hotfix')
          || contains(env.RELEASE_LABELS, 'release-type/patch')
        run: echo "RELEASE_VERSION=patch" >> "$GITHUB_ENV"

      - name: Setup minor release type version
        if: contains(env.RELEASE_LABELS, 'release-type/minor')
        run: echo "RELEASE_VERSION=minor" >> "$GITHUB_ENV"

      - name: Setup major release type version
        if: contains(env.RELEASE_LABELS, 'release-type/major')
        run: echo "RELEASE_VERSION=major" >> "$GITHUB_ENV"

      - name: Prepare committer information
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          GPG_PRIVATE_KEY: ${{ secrets.CI_GPG_SECRET_KEY }}
          GPG_PASSPHRASE: ${{ secrets.CI_GPG_SECRET_KEY_PASSWORD }}
        run: |
          git config --global credential.helper store
          cat <<EOT >> ~/.git-credentials
          https://ci-user:$GITHUB_TOKEN@github.com
          EOT

          # GPG: non-interactive signing setup
          mkdir -p ~/.gnupg && chmod 700 ~/.gnupg
          printf 'allow-loopback-pinentry\nallow-preset-passphrase\n' > ~/.gnupg/gpg-agent.conf
          printf 'use-agent\npinentry-mode loopback\n' > ~/.gnupg/gpg.conf
          gpgconf --kill gpg-agent || true
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          KEY_DATA=$(gpg --list-secret-keys --with-colons)
          echo "$KEY_DATA" | awk -F: '/^grp:/ {print $10}' | while read -r GRIP; do
            /usr/lib/gnupg/gpg-preset-passphrase --preset "$GRIP" <<< "$GPG_PASSPHRASE"
          done

          # Git: identity and signing
          FPR=$(echo "$KEY_DATA" | awk -F: '/^fpr:/ {print $10; exit}')
          git config user.name "srvcosoitxtech"
          git config user.email "oso@inditex.com"
          git config user.signingkey "$FPR"
          git config commit.gpgsign true
          git config tag.gpgsign true

      - name: Update CHANGELOG.md
        id: update-changelog
        uses: release-flow/keep-a-changelog-action@74931dec7ecdbfc8e38ac9ae7e8dd84c08db2f32 # v3.0.0
        with:
          command: bump
          version: ${{ env.RELEASE_VERSION }}
          changelog: code/CHANGELOG.md
          fail-on-empty-release-notes: false
          keep-unreleased-section: true
          tag-prefix: ""

      # Homologated with weave.js's `npm run version:release` +
      # `npm run release:prepare` step pair — see the snapshot job's
      # "NPM / Prepare release" step for why this stays just-free.
      - name: NPM / Prepare release
        working-directory: code
        env:
          RELEASE_VERSION: ${{ steps.update-changelog.outputs.version }}
        run: |
          npm run version:release
          npm run release:prepare

      - name: Build
        working-directory: code
        run: pnpm build

      # pdocs-specific: weave.js publishes npm packages only, with no
      # per-repo build artifact to attach to the GitHub Release. pdocs is a
      # site generator, so its release also ships the ui-bundle zip.
      - name: Locate ui-bundle artifact
        id: artifact
        run: |
          version='${{ steps.update-changelog.outputs.version }}'
          path="code/packages/ui-bundle/build/ui-bundle-${version}.zip"
          if [ ! -f "$path" ]; then
            echo "::error::expected build artifact not found: $path"
            exit 1
          fi
          echo "path=${path}" >> "$GITHUB_OUTPUT"

      - name: NPM / Ensure minimum npm version for trusted publishing
        run: |
          CURRENT_NPM=$(npm --version)
          REQUIRED_NPM="11.5.1"
          if printf '%s\n%s\n' "$REQUIRED_NPM" "$CURRENT_NPM" | sort -V -C; then
            echo "npm $CURRENT_NPM already meets the minimum requirement ($REQUIRED_NPM). Skipping upgrade."
          else
            echo "npm $CURRENT_NPM is below the minimum requirement ($REQUIRED_NPM). Upgrading…"
            npm install -g npm@^11.5.1 --registry="https://registry.npmjs.org/"
            asdf reshim nodejs
          fi
          echo "node path: $(command -v node)"
          echo "npm path: $(command -v npm)"
          node --version
          npm --version

      # The publishable package list is derived from `packages/*/package.json`'s
      # `private` field by scripts/publishable-packages.mjs — see justfile's
      # `release-local` recipe for the human-facing equivalent. `example` is
      # `private: true` and excluded automatically.
      #
      # This step also hard-fails the whole job, before any package is
      # published, if the target version (already bumped into each
      # package.json by "NPM / Prepare release", above) is found already
      # published for any package. Without this pre-check, a mid-loop
      # "already published" failure in the publish steps below would leave
      # earlier packages in the loop live on the registry while later ones
      # never get published in the same run — this check makes that
      # partial-publish state impossible to reach.
      - name: NPM / Verify packages exist in registry
        id: verify-packages
        working-directory: code
        run: |
          mapfile -t PACKAGES < <(node scripts/publishable-packages.mjs)
          MISSING=()
          ALREADY_PUBLISHED=()
          for pkg in "${PACKAGES[@]}"; do
            PKG_NAME=$(node -p "require('./packages/$pkg/package.json').name")
            TARGET_VERSION=$(node -p "require('./packages/$pkg/package.json').version")
            ENCODED_PKG_NAME=$(node -p "encodeURIComponent(process.argv[1])" "$PKG_NAME")
            RESPONSE_FILE=$(mktemp)
            if ! HTTP_STATUS=$(curl -sS -o "$RESPONSE_FILE" -w "%{http_code}" \
              --connect-timeout 10 \
              --max-time 30 \
              --retry 3 \
              --retry-delay 2 \
              --retry-all-errors \
              "https://registry.npmjs.org/${ENCODED_PKG_NAME}"); then
              echo "::error::Failed to verify $PKG_NAME due to npm registry connectivity error"
              rm -f "$RESPONSE_FILE"
              exit 1
            fi
            case "$HTTP_STATUS" in
              200)
                PARSE_STATUS=0
                node -e "
                  try {
                    const d = JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8'));
                    const versions = Object.keys(d.versions || {});
                    if (versions.length === 0) process.exit(1);
                    if (versions.includes(process.argv[2])) process.exit(3);
                    process.exit(0);
                  } catch (e) {
                    console.error('JSON parse error:', e.message);
                    process.exit(2);
                  }
                " "$RESPONSE_FILE" "$TARGET_VERSION" || PARSE_STATUS=$?
                case "$PARSE_STATUS" in
                  0)
                    echo "✓ $PKG_NAME exists in registry, target version $TARGET_VERSION not yet published"
                    ;;
                  1)
                    echo "✗ $PKG_NAME has no active versions (unpublished) — treating as new"
                    MISSING+=("$PKG_NAME")
                    ;;
                  3)
                    echo "::error::$PKG_NAME@$TARGET_VERSION is already published"
                    ALREADY_PUBLISHED+=("$PKG_NAME@$TARGET_VERSION")
                    ;;
                  *)
                    echo "::error::Failed to verify $PKG_NAME — npm registry returned invalid JSON (HTTP 200)"
                    rm -f "$RESPONSE_FILE"
                    exit 1
                    ;;
                esac
                ;;
              404)
                echo "✗ $PKG_NAME NOT found in registry"
                MISSING+=("$PKG_NAME")
                ;;
              429|5??)
                echo "::error::Failed to verify $PKG_NAME due to transient npm registry error (HTTP $HTTP_STATUS)"
                exit 1
                ;;
              *)
                echo "::error::Failed to verify $PKG_NAME due to unexpected npm registry response (HTTP $HTTP_STATUS)"
                exit 1
                ;;
            esac
            rm -f "$RESPONSE_FILE"
          done
          if [[ ${#ALREADY_PUBLISHED[@]} -gt 0 ]]; then
            echo "::error::Refusing to publish anything this run — already published: ${ALREADY_PUBLISHED[*]}"
            exit 1
          fi
          if [[ ${#MISSING[@]} -gt 0 ]]; then
            echo "MISSING_PACKAGES=${MISSING[*]}" >> "$GITHUB_ENV"
            echo "HAS_NEW_PACKAGES=true" >> "$GITHUB_ENV"
            echo "::warning::New packages detected: ${MISSING[*]} — will use NPM_TOKEN instead of OIDC"
          else
            echo "HAS_NEW_PACKAGES=false" >> "$GITHUB_ENV"
            echo "All packages verified in registry — OIDC publish is safe."
          fi

      # weave.js's equivalent is `npm run release:perform`; pdocs has no
      # release:perform nx target, so this loops `pnpm publish` over
      # scripts/publishable-packages.mjs's list directly. `pnpm publish`
      # (not `npm publish`) is required: it rewrites each package's
      # `workspace:*` cross-references to the resolved version at pack
      # time — `npm publish` ships the literal string, which breaks
      # installs in any consuming repo that isn't itself a pnpm workspace.
      # Unlike pdocs' previous release.yml, this is unconditional — no
      # NPM_PUBLISH_ENABLED gate — matching weave.js's always-publish release job.
      - name: NPM / Release Perform (OIDC + provenance)
        if: env.HAS_NEW_PACKAGES == 'false'
        env:
          NPM_CONFIG_PROVENANCE: "true"
        working-directory: code
        run: |
          set -euo pipefail
          mapfile -t PACKAGES < <(node scripts/publishable-packages.mjs)
          for pkg in "${PACKAGES[@]}"; do
            (cd "packages/$pkg" && pnpm publish --access public --no-git-checks)
          done

      - name: NPM / Release Perform (NPM_TOKEN for new packages)
        if: env.HAS_NEW_PACKAGES == 'true'
        env:
          NPM_AUTH: ${{ secrets.NPM_TOKEN }}
        working-directory: code
        run: |
          if [ -z "${NPM_AUTH:-}" ]; then
            echo "::error::NPM_TOKEN secret is required for publishing new packages but is not set"
            exit 1
          fi
          TEMP_NPMRC="$(mktemp)"
          trap 'rm -f "$TEMP_NPMRC"' EXIT
          cp ~/.npmrc "$TEMP_NPMRC"
          chmod 600 "$TEMP_NPMRC"
          echo "//registry.npmjs.org/:_authToken=${NPM_AUTH}" >> "$TEMP_NPMRC"
          export NPM_CONFIG_USERCONFIG="$TEMP_NPMRC"
          set -euo pipefail
          mapfile -t PACKAGES < <(node scripts/publishable-packages.mjs)
          for pkg in "${PACKAGES[@]}"; do
            (cd "packages/$pkg" && pnpm publish --access public --no-git-checks)
          done

      - name: Release / Commit and Tag
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        working-directory: code
        run: |
          version='${{ steps.update-changelog.outputs.version }}'
          git add package.json packages/*/package.json CHANGELOG.md
          git commit -S -m "chore: release ${version} Signed-off-by: srvcosoitxtech <oso@inditex.com>" --no-verify
          git tag -a -m "Release ${version}" "${version}"
          # actions/checkout leaves HEAD detached, not on a local branch named
          # after BASELINE_BRANCH — HEAD:<branch> is correct whether HEAD
          # happens to be attached or detached.
          git push --atomic --no-verify origin "HEAD:${{ env.BASELINE_BRANCH }}" "${version}"

      - name: GitHub Release / Create
        uses: ncipollo/release-action@2c591bcc8ecdcd2db72b97d6147f871fcd833ba5 # v1.14.0
        id: github-release
        continue-on-error: true
        with:
          name: ${{ steps.update-changelog.outputs.version }}
          tag: ${{ steps.update-changelog.outputs.version }}
          token: ${{ steps.app-token.outputs.token }}
          artifacts: ${{ steps.artifact.outputs.path }}
          body: |
            Check out the [changelog](code/CHANGELOG.md) for version ${{ steps.update-changelog.outputs.version }}

      - name: Comment in PR / Release creation failed
        if: ${{ steps.github-release.outcome == 'failure' && github.event_name == 'pull_request' }}
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: >
          gh pr comment ${{ github.event.number }} --body "An error occurred creating the GitHub Release.
          Don't panic! Your artifacts were successfully uploaded to the npmjs registry and the new release tag was created.
          You can manually complete the release by creating it in the [releases](https://github.com/${{ github.repository }}/releases)
          page."
