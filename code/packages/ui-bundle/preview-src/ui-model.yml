#
# Hand-written fixture standing in for what Antora computes at build time.
# Rewritten to be design-shaped (see .figma design linked from GH issue #1 /
# #8) rather than the inherited antora-ui-default sample: one product, the
# Figma side-menu tree, a "Stable" version tag (green only on `latest`) and a
# repo link.
#
# YAML anchors are load-bearing, not decorative: `nav-explore.hbs` compares
# the current component/version against `site.components[].versions[]` with
# the `eq` helper, which for objects is identity — so "the latest version"
# and "the version this page is on" must be the SAME node for `is-current`
# and `is-latest` to light up. Keep every `is-current` / `is-latest` case
# wired through an anchor, not a value that merely looks equal.
#
# Intentionally thin: `site.keys` (beyond `repoUrl`), `page.attributes` are
# populated per-page by build-preview-pages.js, not here. If you add a
# partial that reads a branch this fixture doesn't cover, extend it — don't
# let the gap surface for the first time in a real build.
#
# `asciidoc.extensions` below IS read directly from here (not synthesised
# per-page) — build-preview-pages.js requires each entry and registers it
# globally against Asciidoctor 4.0's own registry before converting
# preview-src/*.adoc, then copies the resulting extensions list onto every
# version's `asciidoc` — see that file's own header comment.
#
antoraVersion: '1.0.0'
asciidoc:
  extensions:
    # GH-14: `label:red[Text]` / `label:[Text]` (grey default) — an IDS
    # Label inline; `mono:[text]` — plain monospaced text, no code chip.
    # Requires the ui-bundle devDependency (package.json) so plain
    # `require()` (not Antora's user-require-helper, unused here)
    # resolves it.
    - '@inditextech/pdocs-asciidoc-extensions'
site:
  url: http://localhost:5252
  title: Atd Docs
  homeUrl: &home_url /landing.html
  keys:
    repoUrl: https://github.com/InditexTech/atd-docs
    # Page footer "how to contribute" button (GH-16): a playbook-level key,
    # same convention as repoUrl above and productLogo below — absent, the
    # button doesn't render (see footer-content.hbs).
    contributeUrl: https://github.com/InditexTech/atd-docs/blob/main/CONTRIBUTING.md
    # Side-menu brand symbol (GH-8): a plain placeholder mark, not a design
    # asset — nav-brand.hbs renders the product name alone when this key is
    # absent, so both paths are worth previewing; this fixture exercises the
    # "logo present" one. copyPreviewAssets ships preview-src/*.svg verbatim.
    productLogo: /product-logo.svg
    # Dark counterpart (GH-9 follow-up): product-logo.svg is a plain black
    # stroke, invisible against a dark side menu with nothing here to swap
    # to — see nav-brand.hbs's own comment for why `currentColor` doesn't
    # save an externally-referenced <img>. This fixture exercises the "both
    # configured" path; a real site missing this key still gets the light
    # mark unconditionally rather than losing it in dark mode.
    productLogoDark: /product-logo-dark.svg
  components:
    - &component
      name: atd
      title: &component_title ATD
      url: *home_url
      versions:
        - &latest_version
          title: *component_title
          url: *home_url
          version: stable
          displayVersion: Stable
          latest: true
        - url: '#'
          version: '2024.1'
          displayVersion: '2024.1'
      latestVersion: *latest_version
    - name: platform
      title: Platform
      url: '#'
      versions:
        - &platform_version
          url: '#'
          version: '3.4'
          displayVersion: '3.4'
      latestVersion: *platform_version
page:
  url: *home_url
  home: true
  title: Hardware and Software Requirements
  component: *component
  componentVersion: *latest_version
  version: stable
  displayVersion: Stable
  module: ROOT
  relativeSrcPath: index.adoc
  editUrl: https://github.com/InditexTech/atd-docs/edit/main/docs/modules/ROOT/pages/index.adoc
  origin:
    private: false
    # Antora derives this per-component from the content source's git remote;
    # header-toolbar's repo link falls back to it when site.keys.repoUrl (set
    # above) is absent. Kept here so the fallback branch is exercised too.
    webUrl: https://github.com/InditexTech/atd-docs
  previous:
    content: Getting started
    url: '#'
    urlType: internal
  next:
    content: Features
    url: '#'
    urlType: internal
  breadcrumbs:
    - content: Overview
      url: '#'
      urlType: fragment
    - content: Hardware and Software Requirements
      url: *home_url
      urlType: internal
  versions:
    - version: stable
      displayVersion: Stable
      latest: true
      url: '#'
    - version: '2024.1'
      displayVersion: '2024.1'
      url: '#'
    - version: '2023.2'
      displayVersion: '2023.2'
      missing: true
      url: '#'
  # Mirrors the Figma side menu (see GH issue #8): top-level entries, one of
  # which ("Features") has its own nested branch — both a `url` and `items`,
  # so it renders expandable with a chevron, like any real page with
  # sub-pages in its own nav.adoc — plus one entry two levels deep ("Virtual
  # Threads" also has its own subpage) so nav-tree recursion, `--tree--
  # level-N` indentation and the expand/collapse toggle all get exercised
  # without the fixture needing a rewrite on every design tweak.
  #
  # An earlier version of this fixture put these under a separate, url-less
  # "Components" wrapper node (Antora's model does allow one, and nav-tree.hbs
  # still renders it correctly — no row, just its children) rather than
  # under Features directly. Visually that looked identical modulo one
  # thing: no chevron on Features, because structurally the sub-items
  # weren't Features' own. That's backwards from what any real "Features"
  # page with sub-pages would produce, so it's fixed here instead of left
  # for the sake of covering the wrapper case.
  navigation:
    - root: true
      items:
        - content: Overview
          url: *home_url
          urlType: internal
        - content: Getting started
          url: '#getting-started'
          urlType: fragment
        - content: Features
          url: '#features'
          urlType: fragment
          items:
            - content: Architecture overview
              url: '#architecture-overview'
              urlType: fragment
            - content: Supported artifacts
              url: '#supported-artifacts'
              urlType: fragment
            - content: Teams
              url: '#teams'
              urlType: fragment
            - content: Virtual Threads
              url: '#virtual-threads'
              urlType: fragment
              items:
                - content: Subpage
                  url: '#virtual-threads-subpage'
                  urlType: fragment
            - content: Resilience
              url: '#resilience'
              urlType: fragment
            - content: Administration
              url: '#administration'
              urlType: fragment
            - content: Tasks and notifications
              url: '#tasks-and-notifications'
              urlType: fragment
        - content: Roles and Permissions
          url: '#roles-and-permissions'
          urlType: fragment
        - content: Templates
          url: '#templates'
          urlType: fragment
        - content: Integrations
          url: '#integrations'
          urlType: fragment
        - content: Additional Information
          url: '#additional-information'
          urlType: fragment
