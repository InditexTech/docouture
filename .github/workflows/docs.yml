name: docs

on:
  push:
    branches: [main]
    paths:
      - "code/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch: {}

concurrency:
  group: docs
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # GH-80: content.sources[] now matches `tags: ['stable']` in
          # addition to `branches: [main]` (Mode 2) — the default shallow,
          # single-branch checkout would leave that tag unreachable when
          # Antora aggregates from this same local clone.
          fetch-depth: 0

      # Same rationale as pr-verify.yml and release.yml: `ivm-node` / `ivm-pnpm`
      # are asdf plugin names that only resolve on Inditex-provisioned machines.
      - name: Read toolchain versions
        id: toolchain
        run: |
          {
            echo "node=$(awk '/^ivm-node /{print $2}' code/.tool-versions)"
            echo "pnpm=$(awk '/^ivm-pnpm /{print $2}' code/.tool-versions)"
          } >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ steps.toolchain.outputs.pnpm }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.toolchain.outputs.node }}
          cache: pnpm
          cache-dependency-path: code/pnpm-lock.yaml

      # code/.npmrc pins the default registry to npmjs. The IOP Design System
      # is not installed in this workspace — see code/tools/ids/README.md —
      # so this needs no credential and never contacts Artifactory.
      - name: Install dependencies
        working-directory: code
        run: pnpm install --frozen-lockfile

      # Builds the UI bundle in this job rather than consuming a release asset,
      # so a docs-only fix on main can publish without first cutting a platform
      # release (release.yml and this workflow are otherwise independent).
      - name: Build UI bundle
        run: pnpm --filter @inditextech/pdocs-ui-bundle build
        working-directory: code

      - name: Resolve site URL
        id: url
        run: |
          # vars.DOCS_SITE_URL is unset until GitHub Pages is enabled — that
          # needs the repo to be public (Pages on a private repo needs GitHub
          # Enterprise Cloud, which this org is not on today). Without it,
          # Antora omits `site.url`: the build still succeeds, just without a
          # sitemap or absolute canonical links — both fine for an artifact
          # nobody deep-links to yet.
          echo "value=${{ vars.DOCS_SITE_URL }}" >> "$GITHUB_OUTPUT"

      - name: Build example site
        working-directory: code/packages/example
        run: |
          args=(--fetch antora-playbook.yml)
          if [ -n "${{ steps.url.outputs.value }}" ]; then
            args+=(--url "${{ steps.url.outputs.value }}")
          fi
          npx antora "${args[@]}"

      - name: Upload site
        uses: actions/upload-artifact@v4
        with:
          name: example-site
          path: code/packages/example/build/site
          retention-days: 30

      # Pages source is the workflow artifact above, packaged for the Pages
      # deploy action specifically. Only produced once vars.DOCS_PAGES_ENABLED
      # is on, so a private-repo run does not pay for an artifact it cannot use.
      - name: Package for Pages
        if: vars.DOCS_PAGES_ENABLED == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: code/packages/example/build/site

  # Off until the repo is public. GitHub Pages on a private repository needs
  # GitHub Enterprise Cloud; flip `vars.DOCS_PAGES_ENABLED` once visibility
  # changes and set `vars.DOCS_SITE_URL` to the resulting pages.dev-style URL
  # (https://<org>.github.io/<repo>/example) — nothing else here needs to
  # change, since the build job already produces a Pages-formatted artifact
  # whenever this is on.
  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: vars.DOCS_PAGES_ENABLED == 'true'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
