# Component stylesheets vendored from the IOP Design System
# (@inditex/sewingiopdsweb-react-components).
#
# Each group is a component directory under that package; the leaves are the
# CSS files taken from it, in the order they should be emitted. There is no
# tree-shaking, so every file listed is paid for in the shipped bundle — list
# only what's actually used. Multi-file components need ALL their files or the
# component breaks (breadcrumbs/ has 4, menu/ 9, list/ 5, modal/ 6) — `ls` the
# directory under code/tools/ids/node_modules/@inditex/sewingiopdsweb-react-
# components/<dir>/ before adding an entry.
#
# Adding a component is one line here plus `just ids-sync`, which regenerates
# src/css/ids-components.css (and pulls in whatever --ids-* tokens it
# references into ids-tokens.css). See tools/ids/README.md and
# .opencode/skills/iop-ds-components/SKILL.md.

components:
  text:
    - text.css # .ids-text--* typography utilities, chrome copy only (not doc prose — see vars.css)
  button:
    - button.css # .ids-button--ghost/--icon-only — header toolbar actions (GH-7, GH-8); also the [card] call to action (GH-20)
  tag:
    - tag.css # .ids-tag--solid/--selected — header toolbar version tag (GH-7)
  option-picker:
    - option-picker.css # .ids-option-picker — group wrapper
    - option-picker-item.css # .ids-option-picker-item — per-option outline/selection state
    - option-picker-button.css # .ids-option-picker-button — the clickable control itself
  list:
    - list.css # .ids-list — nav <ul> reset (GH-8)
    - list-item.css # .ids-list-item[--tree--level-N] (GH-8) — layout/indent only, no --clickable/--selected (state colours are ours, see side-menu.css)
  logo:
    - logo.css # .ids-logo — product symbol fill (GH-8)
  grid-layout:
    - grid-layout.css # .ids-grid-layout[--with-margin] — header/toolbar/hero container (GH-8, GH-9); also the content/ToC container (GH-10, main.hbs) — `.doc`/`.toc`'s own column spans are bundle CSS, not this file's `__item[--span-N]` utility classes (doc.css/toc.css explain why)
  breadcrumbs:
    # Deliberately 2 of the directory's 4 files, not all — see the header
    # comment above about multi-file components needing every file. That rule
    # is for components whose *rendered* markup spans several files; here
    # breadcrumb-ellipsis(-list).css only back the JS-driven overflow-collapse
    # trigger (React's useBreadcrumbsOverflow), which this bundle never
    # renders — hero.hbs lays out every crumb in a plain flex row and lets
    # breadcrumb-item.css's own `text-overflow: ellipsis` handle narrow
    # viewports, no collapse trigger markup at all (GH-9). Also worth noting:
    # breadcrumb-ellipsis.css references `var(--ids-radius-sm)`, which is not
    # a real token in @inditex/sewingiopdsweb-styles under any name — an
    # upstream inconsistency, not something introduced here — so vendoring it
    # would fail `just ids-sync`'s missing-token check regardless.
    - breadcrumb.css # .ids-breadcrumbs — flex row container
    - breadcrumb-item.css # .ids-breadcrumb-item[--link/--active] + its divider
  label:
    - label.css # .ids-label--white — hero page tags (GH-9); .ids-label--grey — [card,labels=…] meta chips (GH-20); .ids-label--green/--orange — "Latest"/"Prerelease" pill on the version dropdown's current-row (GH-103)
  card:
    - card.css # .ids-card--vertical/__image/__content — the ATD Card behind the [cards] block (GH-20, asciidoc-extensions/lib/card-grid.js); its own hover state and surface are what make that block theme-agnostic
  tabs:
    # Deliberately 1 of the directory's 2 files — the same judgement the
    # breadcrumbs entry above records, and for the same reason: tabs.css styles
    # markup this bundle never renders. It is the `.ids-tabs__list` flex ROW and
    # the sliding `.ids-tabs__indicator` (a React-measured element: Tabs.tsx
    # positions it from the selected item's offsetLeft/offsetWidth), plus the
    # overflow-wrapper hooks. The landing's Key features switcher (GH-22, Figma
    # 2696:54801) draws neither — its labels are a right-aligned COLUMN with no
    # indicator at all, laid out in feature-tabs.css.
    #
    # What is vendored is the item itself, which is an exact match rather than
    # an approximation: `.ids-tabs-item` is `label/l` and
    # `.ids-tabs-item--selected` is `label/l-high`, which is precisely the two
    # states the frames draw, and it brings the DS's own `:focus-visible` ring
    # and hover colour with it.
    - tabs-item.css # .ids-tabs-item[--selected] — [feature-tabs] labels (asciidoc-extensions/lib/feature-tabs.js)
  accordion:
    # GH-61 — backs the `.ids-accordion*` selectors Timeline's own
    # `--expandable` variant already ships but left dangling
    # (ids-components.css:2112-2126, no base `.ids-accordion` rule to
    # match against). Native `[%collapsible]`/`<details>` can't carry these
    # BEM classes itself (Asciidoctor owns that markup), so the bundle's
    # own accordion.css (ui-bundle/src/css) restyles `.doc details` against
    # this file's real values rather than applying its selectors — see
    # that file's own header.
    - accordion.css
  modal:
    # GH-66 — the search dialog shell, native `<dialog>` carrying `.ids-modal`
    # instead of the DS's own React portal (`#ids-modal-root`): a top-layer
    # `<dialog>` already gives the stacking, focus trap and Esc-to-close the
    # portal exists for, so search-dialog.css only resets the UA dialog box
    # model onto `.ids-modal`'s flex-centering layout — it doesn't reimplement
    # the portal. `.ids-modal__container` gets its background, border and
    # padding from modal-inline.css alone; vendoring modal.css without it
    # renders a transparent, borderless panel.
    #
    # Deliberately 5 of the directory's 6 files, not all — modal-draggable.css
    # is left out, and for once it's not a judgement call about unused markup
    # (this dialog isn't draggable or resizable — true of modal-header.css too,
    # vendored anyway below) but a hard failure: its own custom properties are
    # named with a BEM `__`, e.g. `--ids-modal__resize-handle-corner-size`, and
    # sync.mjs's DS_VAR_REF_RX (`[a-z0-9-]+`, no underscore) truncates any
    # `var(...)` reference to it at the first `_`, so the script goes looking
    # for a bare `--ids-modal` token that exists nowhere and fails loudly. Not
    # worth teaching the generator a one-off character class for a variant
    # this dialog never renders.
    - modal.css # .ids-modal[--small] / __container — panel sizing
    - modal-content.css # .ids-modal__content[--scrollable] — results area
    - modal-header.css # .ids-modal__header/__title/__actions — unused today (no header row in the sketch), vendored for completeness per the multi-file rule
    - modal-footer.css # .ids-modal__footer[--horizontal] — the ↑↓ · ↵ · esc hint row
    - modal-inline.css # .ids-modal__container's actual background/border/padding
  overlay:
    - overlay.css # .ids-overlay/__content — the dialog's backdrop
  search-field:
    - search-field.minimal.css # .ids-search-field-minimal — the dialog's input row; also fixes preview-src/layouts/icons.hbs's filter box, unstyled until now (GH-66)
  highlight:
    - highlight.css # .ids-highlight__mark — matched-term highlight in results
  empty-state:
    - empty-state.css # .ids-empty-state — "no results" state
    - empty-state-footer.css # .ids-empty-state-footer
  loader:
    - loader.css # .ids-loader — index-loading state
  floating-button:
    # For GH-68 (S4)'s XS trigger, not rendered by this issue — vendored now
    # since it's on the same manifest edit and pulls --ids-size-radius-full
    # into ids-tokens.css automatically via `just ids-sync`.
    - floating-button.css # .ids-floating-button — XS search trigger (S4)
