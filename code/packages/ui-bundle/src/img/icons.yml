# Icons vendored from the IOP Design System.
#
# Each entry is a group and the leaf names taken from it. The leaf name always
# carries its variant suffix (`-outlined` or `-filled`) because the design
# system ships no bare names — `information` does not exist, only
# `information-outlined` and `information-filled`. The symbol id in the
# generated sprite is `sw-icons-<group>-<name>`, matching the design system's
# own ids so the sprite stays swappable with the CDN one.
#
# Group names are not intuitive: `sections` is Zara's womenswear/menswear
# sections, `controls` is media transport only. Use `just icons-search <term>`
# rather than guessing — the search covers all 1370 icons in the mirror, and
# `just icons-build` fails with suggestions when a name is wrong.
#
#   just icons-search sidebar     find the right group/name
#   just icons-build              regenerate src/img/ids-icons.svg
#
# Adding an icon is one line here plus `just icons-build`. Refreshing the
# catalogue from the design system is `just icons-fetch`.

icons:
  accessibility:
    - moon-outlined # theme toggle, dark
  actions:
    - add-outlined
    - back-outlined
    - check-circle-outlined # copy-to-clipboard success (06-copy-to-clipboard.ts); admonition: important (GH-13)
    - close-large-outlined # side-menu drawer close (GH-8, breakpoint xs)
    - copy-outlined
    - full-screen-enter-outlined
    - full-screen-exit-outlined
  alerts:
    - warning-outlined # admonition: warning (GH-13)
    - warning-alt-outlined # admonition: caution (GH-13)
  arrows:
    - arrow-left-outlined # pagination: previous
    - arrow-right-outlined # pagination: next
    - chevron-down-outlined
    - chevron-up-outlined
  business:
    - sticker-outlined # admonition: note (GH-13)
  communication:
    - comment-outlined # admonition: tip (GH-13)
  connectivity:
    - link-outlined # section anchor / copy link
    - link-external-outlined
  controls:
    - play-circle-outlined
  design:
    - menu-tab-outlined # side-menu toggle (GH-8)
    - sidebar-outlined # "on this page" toggle
  others:
    - home-outlined
  weather:
    - sunny-outlined # theme toggle, light

# Icons that also need a CSS-consumable form (a `--icon-mask-<group>-<name>`
# custom property, generated into src/css/icon-masks.css), because Asciidoctor
# with `icons: font` (both playbooks) gives admonitions fixed markup —
# `<i class="fa icon-note" title="Note">` — with no room for the `{{icon}}`
# helper's `<svg><use>`. Every entry here must also be listed under `icons:`
# above; `just icons-build` fails otherwise. See GH-13.
masks:
  actions:
    - check-circle-outlined
  alerts:
    - warning-outlined
    - warning-alt-outlined
  arrows:
    - chevron-down-outlined # collapsible marker (GH-15)
  business:
    - sticker-outlined
  communication:
    - comment-outlined
