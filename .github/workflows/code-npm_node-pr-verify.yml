name: code-npm-pr-verify

concurrency:
  group: code-npm-pr-verify-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Least privilege: this workflow only ever checks out the PR and runs
# read-only verification (lint/test/build) — no step here pushes, comments,
# or otherwise writes back to GitHub, so the default broad token scope is
# more than it needs. CHANGELOG.md entries are not checked here: they are
# generated at release time (see code-changelog-check.yml).
permissions:
  contents: read

on:
  pull_request:
    paths:
      - "code/**"
      - ".github/workflows/code-npm_node-pr-verify.yml"

jobs:
  verify:
    name: Code / Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ASDF_BRANCH_VERSION: 0.18.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Homologated with weave.js's code-npm_node-PR_verify.yml: same asdf
      # setup pattern (cache keyed on .tool-versions, install skipped on
      # cache hit — see https://github.com/asdf-vm/actions/issues/356).
      # code/.tool-versions pins the `nodejs` / `pnpm` asdf plugins — `nodejs`,
      # not `node`, is the registered asdf-plugins short name.
      - name: pnpm / Setup Dependencies Cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('code/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: asdf / Setup Dependencies Cache
        uses: actions/cache@v4
        id: asdf-cache
        with:
          path: ~/.asdf
          key: ${{ runner.os }}-asdf-${{ env.ASDF_BRANCH_VERSION }}-${{ hashFiles('code/.tool-versions') }}

      - name: Save tool-versions content
        run: |
          {
            echo "TOOL_VERSIONS<<EOF"
            cat code/.tool-versions
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Setup asdf environment
        uses: asdf-vm/actions/install@1902764435ca0dd2f3388eea723a4f92a4eb8302 # v4.0.0
        # https://github.com/asdf-vm/actions/issues/356
        if: steps.asdf-cache.outputs.cache-hit != 'true'
        with:
          tool_versions: ${{ env.TOOL_VERSIONS }}
          asdf_version: ${{ env.ASDF_BRANCH_VERSION }}

      # On a cache hit the install step above is skipped, so nothing else
      # puts asdf's shims on PATH — pnpm/node would otherwise be
      # "command not found". Homologated with the identical step in
      # code-npm_node-publish-release-and-snapshot.yml.
      - name: Restore asdf shims to PATH
        if: steps.asdf-cache.outputs.cache-hit == 'true'
        run: |
          echo "$HOME/.asdf/bin" >> "$GITHUB_PATH"
          echo "$HOME/.asdf/shims" >> "$GITHUB_PATH"
          cp code/.tool-versions "$HOME/.tool-versions"

      # Catches invisible Unicode whitespace (e.g. a pasted-in NBSP) before
      # it reaches CHANGELOG.md's [Unreleased] section — that whitespace
      # breaks release-flow/keep-a-changelog-action's markdown parsing of
      # the heading it sits in, which then gets corrupted with a stray
      # backslash escape on every future release. See
      # .github/scripts/sanitize-changelog.mjs for the full story.
      # Homologated with weave.js's identical check in its
      # code-npm_node-PR_verify.yml.
      - name: Verify CHANGELOG.md has no invisible whitespace
        run: node .github/scripts/sanitize-changelog.mjs code/CHANGELOG.md --check

      # code/.npmrc pins the default registry to npmjs. Nothing in this
      # workspace is on a different registry, so this install needs no
      # credential and never contacts a private registry.
      - name: Install dependencies
        working-directory: code
        run: pnpm install --frozen-lockfile

      - name: NPM / Verify
        working-directory: code
        run: |
          npm run verify
